 station by the Grand Canal (no bridge west of Accademia), so factor an extra vaporetto or bridge crossing into daily logistics.", "g": null, "nophoto": "district, not a business"}];
const ON = {}; Object.keys(CATS).forEach(k=>ON[k]=true);

/* ---------- GCJ-02 -> WGS-84 (no-op outside mainland China) ----------
   Google returns GCJ-02 ("Mars") coordinates inside mainland China, offset
   several hundred metres from true WGS-84. Convert for the OSM basemap;
   keep the raw values for Amap, which expects GCJ-02. */
const EE = 0.00669342162296594323, A = 6378245.0;
function outOfChina(lat,lng){ return (lng<72.004||lng>137.8347)||(lat<0.8293||lat>55.8271); }
function tLat(x,y){
  let r = -100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r += (20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r += (160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function tLng(x,y){
  let r = 300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r += (20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r += (150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function gcj2wgs(lat,lng){
  if(outOfChina(lat,lng)) return [lat,lng];
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI;
  let magic=Math.sin(rad); magic=1-EE*magic*magic;
  const sqm=Math.sqrt(magic);
  dLat=(dLat*180)/((A*(1-EE))/(magic*sqm)*Math.PI);
  dLng=(dLng*180)/(A/sqm*Math.cos(rad)*Math.PI);
  return [lat*2-(lat+dLat), lng*2-(lng+dLng)];
}
PLACES.forEach(p=>{ const w=gcj2wgs(p.lat,p.lng); p.wlat=w[0]; p.wlng=w[1]; });

/* ---------- glyphs ---------- */
function glyph(catKey){
  const name = (CATS[catKey]||{}).icon;
  const path = name && ICONS[name];
  return path ? '<svg viewBox="0 0 24 24">'+path+'</svg>' : '';
}

/* ---------- map ---------- */
const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  maxZoom:19, subdomains:'abcd',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> · Places &amp; photos © Google'
}).addTo(map);

const groups = {};
Object.keys(CATS).forEach(k => groups[k] = L.layerGroup());
PLACES.forEach(pl => {
  const icon = L.divIcon({className:'',
    html:'<div class="pin '+(CATS[pl.c].shape||'')+(pl.must?' must':'')+'" style="background:'
         +CATS[pl.c].color+'">'+glyph(pl.c)+(pl.must?'<i class="star-badge"></i>':'')+'</div>',
    iconSize:[23,23], iconAnchor:[11,11]});
  const mk = L.marker([pl.wlat,pl.wlng],{icon, title:pl.n, riseOnHover:true,
    zIndexOffset: pl.must?1000:0});
  mk.on('click',()=>openSheet(pl));
  mk.addTo(groups[pl.c]);
});
Object.keys(CATS).forEach(k => { if(PLACES.some(p=>p.c===k)) groups[k].addTo(map); });

function activeBounds(){
  const pts = PLACES.filter(p=>ON[p.c]).map(p=>[p.wlat,p.wlng]);
  return pts.length ? L.latLngBounds(pts) : L.latLngBounds(PLACES.map(p=>[p.wlat,p.wlng]));
}
function fitAll(){ map.fitBounds(activeBounds(),{padding:[55,55]}); }
fitAll();

/* ---------- panel ---------- */
const keyList = document.getElementById('keyList');
Object.keys(CATS).forEach(k=>{
  const n = PLACES.filter(p=>p.c===k).length;
  if(!n) return;
  const row = document.createElement('label');
  row.className='layer';
  row.innerHTML = '<input type="checkbox" checked>'
    + '<span class="swatch '+(CATS[k].shape||'')+'" style="background:'+CATS[k].color+'">'+glyph(k)+'</span>'
    + '<span>'+CATS[k].label+'</span><span class="n">'+n+'</span>';
  row.querySelector('input').onchange = e=>{
    ON[k]=e.target.checked;
    e.target.checked ? groups[k].addTo(map) : map.removeLayer(groups[k]);
    updateCount();
  };
  keyList.appendChild(row);
});
function updateCount(){
  const n = PLACES.filter(p=>ON[p.c]).length;
  document.getElementById('count').textContent = n + (n===1?" place":" places");
}
updateCount();

const panel=document.getElementById('panel'), layersBtn=document.getElementById('layersBtn');
layersBtn.onclick=()=>{
  panel.classList.toggle('hidden');
  layersBtn.classList.toggle('active', !panel.classList.contains('hidden'));
};

/* ---------- sheet + gallery ---------- */
const sheet=document.getElementById('sheet'),
      gal=document.getElementById('gal'), galTrack=document.getElementById('galTrack'),
      galDots=document.getElementById('galDots'), galCount=document.getElementById('galCount'),
      sTag=document.getElementById('sTag'), sName=document.getElementById('sName'),
      sZh=document.getElementById('sZh'), sMeta=document.getElementById('sMeta'),
      sDesc=document.getElementById('sDesc'), sDist=document.getElementById('sDist'),
      sCredit=document.getElementById('sCredit'), navBtn=document.getElementById('navBtn'),
      gmapBtn=document.getElementById('gmapBtn'),
      sStory=document.getElementById('sStory'), storyBtn=document.getElementById('storyBtn'),
      storyBody=document.getElementById('storyBody'), storyLabel=document.getElementById('storyLabel');
let selected=null;

function buildGallery(pl){
  galTrack.innerHTML=''; galDots.innerHTML='';
  const pics = pl.p || [];
  if(!pics.length){ gal.classList.add('none'); return; }
  gal.classList.remove('none');
  pics.forEach((src,i)=>{
    const img=document.createElement('img');
    img.src=src; img.alt=pl.n+' — photo '+(i+1)+' of '+pics.length; img.loading='lazy';
    img.onerror=()=>{ img.remove(); syncDots(); };
    galTrack.appendChild(img);
    const dot=document.createElement('i'); if(i===0) dot.className='on';
    galDots.appendChild(dot);
  });
  galCount.textContent='1/'+pics.length;
  galPrev.style.visibility = pics.length>1?'':'hidden';
  galNext.style.visibility = pics.length>1?'':'hidden';
  galPrev.disabled=true; galNext.disabled=pics.length<2;
  galDots.style.display = pics.length>1 ? 'flex' : 'none';
  galCount.style.display = pics.length>1 ? 'block' : 'none';
  galTrack.scrollLeft=0;
}
function syncDots(){
  const imgs=galTrack.querySelectorAll('img');
  if(!imgs.length){ gal.classList.add('none'); return; }
  const i=Math.round(galTrack.scrollLeft/galTrack.clientWidth);
  galDots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i));
  galCount.textContent=(i+1)+'/'+imgs.length;
  const multi=imgs.length>1;
  galPrev.style.visibility = multi?'':'hidden';
  galNext.style.visibility = multi?'':'hidden';
  galPrev.disabled = i<=0;
  galNext.disabled = i>=imgs.length-1;
}
galTrack.addEventListener('scroll',()=>{ window.requestAnimationFrame(syncDots); });

/* arrows, for mice and keyboards; touch users just swipe */
const galPrev=document.getElementById('galPrev'), galNext=document.getElementById('galNext');
function galScroll(dir){
  const w=galTrack.clientWidth||1;
  const i=Math.round(galTrack.scrollLeft/w)+dir;
  const n=galTrack.querySelectorAll('img').length;
  galTrack.scrollTo({left: Math.max(0,Math.min(n-1,i))*w, behavior:'smooth'});
}
galPrev.onclick=e=>{e.stopPropagation();galScroll(-1);};
galNext.onclick=e=>{e.stopPropagation();galScroll(1);};

function openSheet(pl){
  selected=pl;
  const cat=CATS[pl.c];
  buildGallery(pl);
  sTag.textContent=cat.label; sTag.style.background=cat.color;
  sName.textContent=pl.n;
  sZh.textContent=pl.zh||""; sZh.style.display = pl.zh ? 'block':'none';
  sMeta.textContent=pl.m||"";
  sDesc.textContent=pl.d;
  if(pl.s){
    storyBody.textContent=pl.s;
    storyLabel.textContent=pl.sl||"The story";
    sStory.style.display='block';
    sStory.classList.remove('open');
    storyBtn.setAttribute('aria-expanded','false');
  } else { sStory.style.display='none'; }
  const credits=(pl.a&&pl.a.length) ? "Photos: "+[...new Set(pl.a)].join(", ")+" — via Google Maps. Traveller submissions, not curated." : "Place data © Google";
  sCredit.textContent=credits;
  navBtn.href="https://www.google.com/maps/dir/?api=1&destination="+pl.wlat+","+pl.wlng+"&travelmode=walking";
  gmapBtn.href=pl.g;
  updateDist();
  sheet.classList.remove('dragging');
  sheet.style.transform='';
  sheet.scrollTop=0;
  sheet.classList.add('open');
  panToPlace(pl);
}
storyBtn.onclick=()=>{
  const open=sStory.classList.toggle('open');
  storyBtn.setAttribute('aria-expanded', open?'true':'false');
};
/* Wide screens show the card as a left-hand panel, so the gesture axis and the
   map centring both have to change. Keep this threshold in sync with the CSS. */
const SIDE_MIN_WIDTH = 720;
function sideMode(){ return window.innerWidth >= SIDE_MIN_WIDTH; }

function panToPlace(pl){
  const ll = L.latLng(pl.wlat, pl.wlng);
  if(!sideMode()){ map.panTo(ll,{animate:true}); return; }
  // shift the centre left by half the panel so the pin sits in the visible half
  const panelW = (document.querySelector('.sheet')||{}).offsetWidth || 390;
  const pt = map.project(ll, map.getZoom()).subtract([panelW/2, 0]);
  map.panTo(map.unproject(pt, map.getZoom()), {animate:true});
}

function dismissSheet(){
  if(!sheet.classList.contains('open')) return;
  sheet.classList.remove('dragging');
  sheet.style.transform='';
  sheet.classList.remove('open');
  selected=null;
}
document.getElementById('closeSheet').onclick=dismissSheet;

/* ---- swipe the card down to dismiss ----
   Touch: drag anywhere in the card, but only when it is scrolled to the top, so
   reading a long card still scrolls normally and the gallery still swipes sideways.
   Mouse: drag the grab handle. */
let drag=null;
sheet.addEventListener('pointerdown', e=>{
  if(!sheet.classList.contains('open')) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const onHandle = !!(e.target.closest && e.target.closest('.grabber'));
  if(!onHandle){
    if(e.pointerType==='mouse') return;
    if(e.target.closest && e.target.closest('a,button,input')) return;
    // In side mode the dismiss axis IS the gallery axis, so the gallery wins
    // any gesture that starts on a photo.
    if(sideMode() && e.target.closest && e.target.closest('.gal')) return;
    // Vertical scroll only conflicts with the bottom sheet.
    if(!sideMode() && sheet.scrollTop>0) return;
  }
  drag={y0:e.clientY, x0:e.clientX, axis: onHandle?'go':null, dy:0, t0:Date.now()};
});
function dragMove(e){
  if(!drag) return;
  const dy=e.clientY-drag.y0, dx=e.clientX-drag.x0;
  const side=sideMode();
  // side panel slides out to the LEFT; bottom sheet slides DOWN
  const along = side ? -dx : dy;      // movement toward dismissal
  const across = side ? dy : dx;      // movement that belongs to the gallery
  if(!drag.axis){
    if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
    drag.axis = Math.abs(along)>Math.abs(across) ? 'go' : 'other';
    if(drag.axis==='other'){ drag=null; return; }   // let the gallery scroll
  }
  if(along<=0){ drag.dy=0; sheet.classList.remove('dragging'); sheet.style.transform=''; return; }
  drag.dy=along;
  sheet.classList.add('dragging');
  sheet.style.transform = side ? 'translateX(-'+along+'px)' : 'translateY('+along+'px)';
}
function dragEnd(){
  if(!drag) return;
  const dy=drag.dy, dt=Math.max(1, Date.now()-drag.t0);
  drag=null;
  sheet.classList.remove('dragging');
  sheet.style.transform='';
  if(dy>90 || (dy>28 && dy/dt>0.5)) dismissSheet();   // distance OR flick
}
window.addEventListener('pointermove', dragMove);
window.addEventListener('pointerup', dragEnd);
window.addEventListener('pointercancel', dragEnd);
/* cancel the browser's own scroll only once we have committed to a downward drag */
sheet.addEventListener('touchmove', e=>{
  if(drag && drag.axis==='go' && drag.dy>0) e.preventDefault();
}, {passive:false});

/* ---- tap outside to dismiss ----
   A map click fires only on a genuine tap, never after a pan, so dragging the map
   leaves the card open. Marker clicks stop propagation, so they swap cards instead. */
map.on('click', dismissSheet);
document.addEventListener('pointerdown', e=>{
  if(!sheet.classList.contains('open')) return;
  if(sheet.contains(e.target)) return;
  const ab=document.getElementById('about');
  if(ab && ab.classList.contains('open')) return;
  if(e.target.closest && e.target.closest('.leaflet-container')) return;
  dismissSheet();
}, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') dismissSheet(); });

/* ---------- city overview ---------- */
const about=document.getElementById('about'), aboutBtn=document.getElementById('aboutBtn');
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function rich(x){ // allow **bold** only
  return esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function renderAbout(){
  if(!CITY || !Object.keys(CITY).length){ aboutBtn.style.display='none'; return; }
  document.getElementById('abTitle').textContent = CITY.name||'';
  document.getElementById('abTagline').textContent = CITY.tagline||'';

  const st=document.getElementById('abStats');
  st.innerHTML=(CITY.stats||[]).map(s=>
    '<div class="stat"><div class="k">'+esc(s[0])+'</div><div class="v">'+esc(s[1])+'</div></div>'
  ).join('');
  st.style.display=(CITY.stats||[]).length?'grid':'none';

  document.getElementById('abSections').innerHTML=(CITY.sections||[]).map(s=>
    '<h3>'+esc(s[0])+'</h3>'+String(s[1]).split('\n\n').map(par=>'<p>'+rich(par)+'</p>').join('')
  ).join('');

  const musts=CITY.musts||[];
  document.getElementById('abMusts').innerHTML = musts.length
    ? '<h3>Must see, do &amp; try</h3><ul class="musts">'
      + musts.map(m=>'<li>'+rich(m)+'</li>').join('') + '</ul>'
    : '';

  const near=CITY.nearby||[];
  document.getElementById('abNearby').innerHTML = near.length
    ? '<h3>Nearby</h3><ul class="nearby">'
      + near.map(n=>'<li>'+rich(n)+'</li>').join('') + '</ul>'
    : '';

  document.getElementById('abFoot').textContent = CITY.foot||'';
}
renderAbout();
function toggleAbout(open){
  about.classList.toggle('open',open);
  about.setAttribute('aria-hidden',open?'false':'true');
  aboutBtn.classList.toggle('active',open);
  if(open) about.scrollTop=0;
}
aboutBtn.onclick=()=>toggleAbout(!about.classList.contains('open'));
document.getElementById('aboutClose').onclick=()=>toggleAbout(false);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') toggleAbout(false); });

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fsBtn');
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    req ? req.call(el) : toast("Fullscreen isn't available here — open the file in your browser.");
  } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};
document.addEventListener('fullscreenchange',()=>{
  fsBtn.classList.toggle('active',!!document.fullscreenElement);
  setTimeout(()=>map.invalidateSize(),250);
});

/* ---------- live location ---------- */
const locBtn=document.getElementById('locBtn');
let watchId=null, meMarker=null, accCircle=null, myPos=null, firstFix=true;
const inFrame=(window.self!==window.top);

locBtn.onclick=()=>{
  if(watchId!==null){stopWatch();return;}
  if(!navigator.geolocation){toast("Location isn't available in this browser.");return;}
  if(!window.isSecureContext){
    toast("Location needs a secure page. Serve this file over https:// or localhost — file:// is blocked by the browser.");
    return;
  }
  locBtn.classList.add('locating'); firstFix=true;
  watchId=navigator.geolocation.watchPosition(pos=>{
    locBtn.classList.remove('locating'); locBtn.classList.add('active');
    myPos=[pos.coords.latitude,pos.coords.longitude];
    const acc=pos.coords.accuracy;
    if(!meMarker){
      meMarker=L.marker(myPos,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:"You are here"}).addTo(map);
      accCircle=L.circle(myPos,{radius:acc,color:'#2b7fff',weight:1,fillColor:'#2b7fff',fillOpacity:.08}).addTo(map);
    } else { meMarker.setLatLng(myPos); accCircle.setLatLng(myPos).setRadius(acc); }
    if(firstFix){map.setView(myPos,14);firstFix=false;}
    updateDist();
  },err=>{
    locBtn.classList.remove('locating'); stopWatch();
    let msg;
    if(err.code===1) msg = inFrame ? "This preview blocks location. Download the file and open it over https:// for live tracking."
                                   : "Location permission denied — enable it for this site in your browser settings.";
    else if(err.code===2) msg = "Position unavailable — no GPS or network fix right now.";
    else msg = "Timed out getting your location. Try again outdoors.";
    toast(msg);
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};
function stopWatch(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  locBtn.classList.remove('active','locating');
  if(meMarker){map.removeLayer(meMarker);meMarker=null;}
  if(accCircle){map.removeLayer(accCircle);accCircle=null;}
  myPos=null; updateDist();
}
function updateDist(){
  if(!selected) return;
  if(myPos){
    const d=map.distance(myPos,[selected.wlat,selected.wlng]);
    sDist.textContent = d<1000 ? "📍 "+Math.round(d)+" m away · ~"+Math.max(1,Math.round(d/80))+" min walk"
                               : "📍 "+(d/1000).toFixed(1)+" km away";
  } else sDist.textContent="";
}

let wasSide=sideMode();
window.addEventListener('resize',()=>{
  const now=sideMode();
  if(now!==wasSide){ wasSide=now; if(selected) panToPlace(selected); }
});

document.getElementById('fitBtn').onclick=fitAll;

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}
</script>
</body>
