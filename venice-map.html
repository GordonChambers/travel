<!DOCTYPE html>
<!-- city-guide-maps template v7 capabilities: swipe-dismiss,drag-handlers,click-away,escape-key,gallery,side-panel,must-see,overview,filters,fullscreen,geolocation -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Venice — Where to Go & Eat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#151b24; --paper:#fff; --muted:#5b6472; --line:#e3e7ec; --accent:#0b7a5c;
    --shadow:0 6px 24px rgba(16,24,40,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;background:#e8e4dc;color:var(--ink)}
  #map{position:absolute;inset:0;z-index:1}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px;pointer-events:none}
  .title-chip{pointer-events:auto;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);
    padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title-chip h1{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .title-chip .count{font-size:11.5px;color:var(--muted);white-space:nowrap}

  .ctrl-stack{position:absolute;right:12px;top:70px;z-index:1000;display:flex;flex-direction:column;gap:10px}
  .ctrl-btn{width:46px;height:46px;border:none;border-radius:12px;background:var(--paper);
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);transition:transform .12s ease,background .12s ease}
  .ctrl-btn:active{transform:scale(.93)}
  .ctrl-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .ctrl-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ctrl-btn.active{background:var(--accent);color:#fff}
  .ctrl-btn.locating svg{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.ctrl-btn.locating svg{animation:none;opacity:.6}}

  .panel{position:absolute;left:12px;top:70px;z-index:1000;width:242px;background:var(--paper);
    border-radius:14px;box-shadow:var(--shadow);padding:12px 13px;
    max-height:calc(100vh - 100px);overflow-y:auto;transform-origin:top left;
    transition:opacity .18s ease,transform .18s ease}
  .panel.hidden{opacity:0;transform:scale(.94);pointer-events:none}
  .panel h3{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .layer{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;font-size:13.5px;font-weight:600}
  .layer input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .layer .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
  .swatch{width:19px;height:19px;border-radius:50%;flex-shrink:0}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}

  .pin{position:relative;width:23px;height:23px;border-radius:50%;border:2.5px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
  .pin svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}
  .pin.food{border-radius:6px}
  .pin.drink{border-radius:4px;transform:rotate(45deg)}
  .pin.drink svg{transform:rotate(-45deg)}
  .pin.must{border-color:#F2C14E;border-width:3px;
    box-shadow:0 0 0 1.5px rgba(120,80,0,.55),0 2px 7px rgba(0,0,0,.45)}
  .star-badge{position:absolute;top:-5px;right:-5px;width:12px;height:12px;
    background:#F2C14E;border-radius:50%;border:1.5px solid #fff;
    box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .swatch{display:flex;align-items:center;justify-content:center}
  .swatch svg{width:11.5px;height:11.5px;fill:none;stroke:#fff;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round}
  .swatch.drink{border-radius:3px;transform:rotate(45deg)}
  .swatch.drink svg{transform:rotate(-45deg)}
  .swatch.food{border-radius:5px}
  .me-dot{width:18px;height:18px;border-radius:50%;background:#2b7fff;border:3px solid #fff;
    box-shadow:0 0 0 8px rgba(43,127,255,.22),0 2px 6px rgba(0,0,0,.3)}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--paper);
    border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.28);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,.35,1);
    max-height:76vh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}

  /* ---- gallery ---- */
  .gal{position:relative;background:#eef1f5;border-radius:20px 20px 0 0;overflow:hidden}
  .gal.none{display:none}
  .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gal-track::-webkit-scrollbar{display:none}
  .gal-track img{width:100%;height:180px;object-fit:cover;flex:0 0 100%;scroll-snap-align:center;display:block}
  .gal-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    display:flex;gap:5px;z-index:2}
  .gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);
    box-shadow:0 1px 2px rgba(0,0,0,.4);transition:background .2s}
  .gal-dots i.on{background:#fff}
  .gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;
    background:rgba(0,0,0,.42);color:#fff;display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);transition:background .15s ease}
  .gal-nav:hover{background:rgba(0,0,0,.65)}
  .gal-nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .gal-nav svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round}
  .gal-nav.prev{left:8px} .gal-nav.next{right:8px}
  .gal-nav[disabled]{opacity:.3;cursor:default}
  /* only for real pointers — touch users swipe */
  @media (hover:hover) and (pointer:fine){
    .gal:hover .gal-nav, .gal-nav:focus-visible{display:flex}
  }
  .gal-count{position:absolute;bottom:7px;right:10px;z-index:2;font-size:10px;font-weight:700;
    color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:99px;backdrop-filter:blur(4px)}

  .sheet-body{padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
  .sheet.dragging{transition:none}
  .grabber{position:absolute;top:0;left:50%;margin-left:-70px;width:140px;height:24px;z-index:4;
    display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
  .grabber:active{cursor:grabbing}
  .grabber::after{content:"";width:38px;height:4px;border-radius:99px;background:rgba(0,0,0,.34);
    box-shadow:0 0 0 1px rgba(255,255,255,.45)}
  /* when there is no photo the grabber would sit on the text */
  .sheet:has(.gal.none) .sheet-body{padding-top:24px}
  .close-x{position:absolute;top:10px;right:10px;width:32px;height:32px;z-index:3;border:none;
    border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:15px;cursor:pointer;line-height:1}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#fff;padding:3px 9px;border-radius:99px;margin-bottom:8px}
  .sheet h2{font-size:19.5px;font-weight:800;margin-bottom:3px;line-height:1.25;letter-spacing:-.01em}
  .zh{font-size:13.5px;color:var(--muted);margin-bottom:5px}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .desc{font-size:14.5px;color:#374050;line-height:1.5;margin-bottom:8px}
  .dist{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:12px;min-height:15px}
  .story{margin:10px 0 2px}
  .story-btn{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;
    background:#f6f2ea;border:1px solid #e8e0d2;border-radius:11px;cursor:pointer;
    font-size:13.5px;font-weight:700;color:#6b5330;text-align:left;font-family:inherit}
  .story-btn:hover{background:#f1ebe0}
  .story-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .story-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .story-btn .chev{margin-left:auto;transition:transform .2s ease}
  .story.open .story-btn .chev{transform:rotate(180deg)}
  .story-body{display:none;font-size:14px;line-height:1.55;color:#4a4033;
    padding:11px 13px 2px;border-left:2px solid #e0d3ba;margin:9px 0 0 4px}
  .story.open .story-body{display:block}
  .credit{font-size:10px;color:#95a0ae;margin-top:11px;line-height:1.45}
  .actions{display:flex;gap:8px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;
    border-radius:12px;border:none;cursor:pointer;font-size:13.5px;font-weight:700;
    text-decoration:none;transition:transform .1s ease}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn.nav{background:var(--ink);color:#fff}
  .btn.gmap{background:#eef1f5;color:var(--ink)}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- city overview sheet ---- */
  .about{position:absolute;inset:0;z-index:1400;background:var(--paper);
    overflow-y:auto;transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,.35,1);
    -webkit-overflow-scrolling:touch}
  .about.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.about{transition:none}}
  .about-inner{max-width:640px;margin:0 auto;padding:18px 20px calc(40px + env(safe-area-inset-bottom))}
  .about h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
  .about .tagline{font-size:14.5px;color:var(--muted);line-height:1.5;margin-bottom:16px}
  .about-close{position:sticky;top:0;float:right;width:34px;height:34px;border:none;
    border-radius:50%;background:#eef1f5;color:#5b6472;font-size:16px;cursor:pointer;
    line-height:1;z-index:2;margin-left:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;
    margin-bottom:20px}
  .stat{background:#f6f4ef;border-radius:11px;padding:9px 11px}
  .stat .k{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#8b8577;margin-bottom:2px}
  .stat .v{font-size:14px;font-weight:700;line-height:1.25}
  .about h3{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:20px 0 7px}
  .about p{font-size:14.5px;line-height:1.6;color:#374050;margin-bottom:9px}
  .musts{list-style:none;margin:2px 0 4px}
  .musts li{position:relative;padding:7px 0 7px 27px;font-size:14.5px;line-height:1.5;
    border-bottom:1px solid #f0ece4}
  .musts li:last-child{border-bottom:none}
  .musts li::before{content:"";position:absolute;left:5px;top:14px;width:9px;height:9px;
    border-radius:50%;background:#F2C14E;box-shadow:0 0 0 2px rgba(242,193,78,.28)}
  .musts b{font-weight:750}
  .nearby li{padding:7px 0 7px 27px;font-size:14px;line-height:1.5;list-style:none;
    position:relative;color:#374050}
  .nearby li::before{content:"";position:absolute;left:6px;top:15px;width:7px;height:7px;
    border-radius:50%;background:#9E9D24}
  .about .foot{font-size:11.5px;color:#95a0ae;margin-top:22px;line-height:1.5;
    border-top:1px solid var(--line);padding-top:13px}
  /* ---- wide / landscape: the card becomes a left-hand panel ----
     A full-width bottom sheet letterboxes photos badly once the window is wide. */
  @media (min-width:720px){
    .sheet{left:0;right:auto;top:0;bottom:0;width:390px;max-height:none;height:100%;
      border-radius:0 20px 20px 0;box-shadow:8px 0 30px rgba(16,24,40,.22);
      transform:translateX(-105%)}
    .sheet.open{transform:translateX(0)}
    .gal, .gal-track img{border-radius:0 20px 0 0}
    .gal-track img{height:auto;aspect-ratio:3/2}
    .grabber{top:0;bottom:0;left:auto;right:0;margin-left:0;width:24px;height:100%;
      flex-direction:column}
    .grabber::after{width:4px;height:38px}
    .sheet:has(.gal.none) .sheet-body{padding-top:16px}
    .sheet-body{padding-right:26px}
    /* keep the filter panel clear of the card */
    .panel{left:auto;right:70px}
    .about-inner{padding-left:26px}
  }
  @media (min-width:720px) and (max-height:520px){
    /* phone held sideways: shorter, so trim the photo further */
    .gal-track img{aspect-ratio:2/1}
  }
  .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,80px);z-index:1200;
    background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:transform .25s ease,opacity .25s ease;max-width:88vw;text-align:center;line-height:1.4}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .leaflet-control-attribution{font-size:10px}
  @media (max-width:420px){ .panel{width:210px} }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of places worth visiting"></div>

<div class="topbar">
  <div class="title-chip">
    <h1>Venice — Where to Go & Eat</h1>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="ctrl-stack">
  <button class="ctrl-btn" id="layersBtn" title="Filter and key" aria-label="Show filters and colour key">
    <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </button>
  <button class="ctrl-btn" id="aboutBtn" title="About this city" aria-label="About this city">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  </button>
  <button class="ctrl-btn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
  <button class="ctrl-btn" id="locBtn" title="My location" aria-label="Show my live location">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>
  <button class="ctrl-btn" id="fitBtn" title="Fit all" aria-label="Zoom to show everything">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 12h6M12 9v6"/></svg>
  </button>
</div>

<div class="panel hidden" id="panel">
  <h3>Filter by type</h3>
  <div id="keyList"></div>
  <p class="note">Pin shapes: circle = sight, square = food, diamond = drink. Gold ring = must-see. CLOSED days and hard constraints are in the meta line, in caps.</p>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Place details">
  <div class="grabber" id="grabber" aria-hidden="true"></div>
  <button class="close-x" id="closeSheet" aria-label="Close">✕</button>
  <div class="gal" id="gal">
    <div class="gal-track" id="galTrack"></div>
    <button class="gal-nav prev" id="galPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="gal-nav next" id="galNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="gal-dots" id="galDots"></div>
    <span class="gal-count" id="galCount"></span>
  </div>
  <div class="sheet-body">
    <span class="tag" id="sTag"></span>
    <h2 id="sName"></h2>
    <p class="zh" id="sZh"></p>
    <p class="meta" id="sMeta"></p>
    <p class="desc" id="sDesc"></p>
    <p class="dist" id="sDist"></p>
    <div class="story" id="sStory">
      <button class="story-btn" id="storyBtn" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M12 8v-2M12 6a4 4 0 0 1 4 4c0 1.8-1.3 2.7-2 3.5-.5.6-.7 1-.7 1.5h-2.6c0-.5-.2-.9-.7-1.5-.7-.8-2-1.7-2-3.5a4 4 0 0 1 4-4zM10 18h4M11 21h2"/></svg>
        <span id="storyLabel">The story</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="story-body" id="storyBody"></div>
    </div>
    <div class="actions">
      <a class="btn nav" id="navBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M3 11l19-8-8 19-2-8-9-3z"/></svg>Directions
      </a>
      <a class="btn gmap" id="gmapBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Place page
      </a>
    </div>
    <p class="credit" id="sCredit"></p>
  </div>
</div>

<div class="about" id="about" role="dialog" aria-label="About this city" aria-hidden="true">
  <div class="about-inner">
    <button class="about-close" id="aboutClose" aria-label="Close">✕</button>
    <h2 id="abTitle"></h2>
    <p class="tagline" id="abTagline"></p>
    <div class="stats" id="abStats"></div>
    <div id="abSections"></div>
    <div id="abMusts"></div>
    <div id="abNearby"></div>
    <p class="foot" id="abFoot"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {"church": {"label": "Churches", "color": "#6A1B9A", "icon": "church"}, "landmark": {"label": "Icons & monuments", "color": "#5D4037", "icon": "landmark"}, "theatre": {"label": "Theatres & opera", "color": "#AD1457", "icon": "drama"}, "museum": {"label": "Museums & galleries", "color": "#1565C0", "icon": "palette"}, "jewish": {"label": "Jewish heritage", "color": "#8D6E63", "icon": "scroll"}, "district": {"label": "Neighbourhoods & walks", "color": "#00897B", "icon": "footprints"}, "cheap": {"label": "Cicchetti & cheap eats (€)", "color": "#00ACC1", "icon": "utensils", "shape": "food"}, "mid": {"label": "Mid-range (€€)", "color": "#F9A825", "icon": "utensils", "shape": "food"}, "splurge": {"label": "Splurge (€€€)", "color": "#C2185B", "icon": "utensils-crossed", "shape": "food"}, "pastry": {"label": "Pastries & bakeries", "color": "#8D5524", "icon": "croissant", "shape": "food"}, "gelato": {"label": "Gelato", "color": "#F06292", "icon": "ice-cream-cone", "shape": "food"}, "cafe": {"label": "Historic cafés", "color": "#6D4C41", "icon": "coffee", "shape": "food"}, "drink": {"label": "Bars & wine bars", "color": "#37474F", "icon": "wine", "shape": "drink"}, "stay": {"label": "Where to stay", "color": "#757575", "icon": "bed"}};

const CITY  = {"name": "Venice", "tagline": "A republic of 118 islands that ruled Mediterranean trade for a thousand years, now a living city of roughly 50,000 people inside a museum piece.", "stats": [["Historic-centre population", "~48,000 (down from ~175,000 in 1950)"], ["Founded", "traditionally 421 AD; first Doge 697 AD"], ["Sestieri", "6 — San Marco, Castello, Cannaregio, San Polo, Santa Croce, Dorsoduro"], ["Airport → centre", "Marco Polo (VCE): ~75min Alilaguna boat or ~20min bus to Piazzale Roma"], ["Best months", "May–June, September–October (July–Aug hot & humid; Nov–Feb risk of acqua alta)"], ["Budget/day", "~€60 thrifty (cicchetti + vaporetto pass), ~€150 comfortable (sit-down meals, museums)"], ["Getting around", "on foot + vaporetto (ACTV); no cars, no bikes allowed in the historic centre"], ["Tourist tax", "small nightly contribution charged by most hotels; day-trippers pay a separate access fee on peak dates"]], "sections": [["History in five minutes", "Refugees from mainland barbarian invasions settled these mudflats from the 5th century, building on wooden piles driven into clay — a foundation so effective it still holds up medieval palaces today. Trade with Byzantium and the Islamic world made Venice fantastically rich by the 1200s; the Fourth Crusade's sack of Constantinople in 1204 filled the city with loot, including the bronze horses now on St Mark's. The Republic peaked around 1500, then declined as Atlantic trade routes bypassed the Mediterranean and the Ottoman Empire squeezed its eastern holdings. Napoleon ended 1,100 years of independence in 1797 without a fight — the last Doge simply abdicated."], ["Culture and society", "Venice today runs on two economies: tourism, which brings in roughly 20 times the resident population each year, and a shrinking population that has halved since the 1950s as locals move to the mainland for affordable housing. What's left is genuinely local in the outer sestieri — Cannaregio and Castello still have butchers, school runs and campo gossip — even as the San Marco core can feel like a stage set."], ["Economy, then and now", "Medieval Venice's wealth came from controlling the spice and silk routes between Asia and Europe, with the Arsenale shipyard capable of building a warship in a single day at its peak. Modern Venice runs on tourism, Murano glass, the Biennale art and architecture exhibitions, and a busy cruise-port economy now restricted from sailing the largest ships past St Mark's Square after 2021 environmental rules."], ["Iconic food & drink", "Cicchetti — small bar snacks eaten standing at a bacaro with an ombra (small glass of wine) — are the real Venetian meal, not the printed tourist-menu pizza. Look for baccalà mantecato (whipped salt-cod cream), sarde in saor (sweet-and-sour sardines, a sailors' preservation dish dating to the 1300s), and bigoli in salsa (thick pasta with anchovy-onion sauce). The Aperol/Select spritz was born in the Veneto and is drunk from late afternoon onward, not as a full meal replacement."], ["Unique to Venice", "No cars, no bikes, no wheeled traffic of any kind in the historic centre — everything moves by boat or on foot across some 435 bridges. Acqua alta (exceptional high water) floods the lowest squares several times most autumns and winters; raised walkways go up in St Mark's Square when it happens. The MOSE flood barrier, operational since 2020, now closes the lagoon inlets before the worst surges, though minor flooding still occurs."]], "musts": ["**St Mark's Basilica** — nave FREE, Pala d'Oro ~€7", "**Doge's Palace** — ~€30 combined museums pass", "**St Mark's Campanile** — ~€10", "**Rialto Bridge** — FREE", "**Scuola Grande di San Rocco** — ~€10", "**Peggy Guggenheim Collection** — ~€16", "**A cicchetti crawl at All'Arco and Cantina Do Mori** — ~€15–20 for a full round"], "nearby": ["**The lagoon islands and Veneto mainland** — Murano, Burano, Torcello, Padua, Verona, Vicenza and Treviso are covered in the companion **Venice — Surrounds** map, built for the same trip."], "foot": "Prices indicative for 2026 and worth re-checking before booking, especially museum tickets which move often. Sources: Wikivoyage, GPSmyCity walking tours, Italian-language bacaro blogs (Moveo, Fine Dining Lovers, VeneziaToday, VeneziaDaEsplorare, PradelleTorri), Michelin Guide Italy, MUVE (Fondazione Musei Civici di Venezia) visitor information, and neighbourhood guides from Faraway Worlds, The Hotel Guru, Untold Italy, Go Ask a Local and Cultured Voyages. Museo Correr begins a phased multi-year renovation from late Nov 2026, so it is left off this map pending clearer reopening dates — check visitmuve.it before planning around it."};
const PLACES = [{"c": "church", "n": "St Mark's Basilica", "zh": "Basilica di San Marco", "must": true, "lat": 45.4345606, "lng": 12.3397125, "m": "4.7★ · nave FREE · Pala d'Oro & Treasury ~€7 · loggia/museum ~€10 · CLOSED to bags — use the deposit next door", "d": "Byzantine domes and 8,000m² of gold mosaic over the doge's own chapel, begun 1063 to house relics of St Mark smuggled out of Alexandria in a barrel of pork. The nave is free but timed-entry booking online avoids the worst queue; pay separately to see the jewel-crusted Pala d'Oro altarpiece and to climb to the loggia for the view over the Piazza and the original bronze horses.", "g": "https://maps.google.com/?cid=725876855649640965", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCskqEwAwIBoEHY94gQBfEvK2ORuRjtjREh8qVABaocfwgzsJusWSBOKUN3dDaNgICCw5jKMSc7nfrQ3O_qkjSBGa8Xbg_GfNZ9Eo04HFO5q-5wYVsQj4Z0xXdTrL2yCzsgZwCXuJoIahPSPA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCoAvQKjRvyXPbqA-G0D7ifv2ZnvtIjYLhbg-1OzvFkUwE641asuXvYCQRz8VqMZc3OmhxLv8dnwZ6KCIiKya0BeiB1vYbFQ4dwxlDuEbZPKooP7Q5rcOmyQ3l3BH1HVD0dAVusKNiPEVuGT0Q=s4800-w800-h600"], "a": ["Ali Mir", "Franc P"], "s": "The four bronze horses on the loggia are Roman or Greek originals looted from Constantinople's Hippodrome during the Fourth Crusade in 1204 — Venice's single biggest theft. Napoleon later carted them off to Paris in 1797; they came back in 1815 and now stand as replicas outside, the weathered originals kept safe in the basilica's museum.", "sl": "The horses stolen twice over"}, {"c": "landmark", "n": "Doge's Palace", "zh": "Palazzo Ducale", "must": true, "lat": 45.4337035, "lng": 12.3403894, "m": "4.7★ · ~€30 St Mark's Square Museums pass · 9am–7pm (Fri–Sat to 11pm)", "d": "Gothic seat of the Venetian Republic for a thousand years, its pink Veronese-marble facade floating on a delicate arcade. Inside, Tintoretto's vast Paradiso fills the Great Council Hall and the route crosses the Bridge of Sighs into the old prisons. Book online — the ticket also covers the Correr, Archaeological and Marciana Library museums.", "g": "https://maps.google.com/?cid=13261361496095093969", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjD6f69OrsscvQxccv14dGoM7PT9lnXMUIO1MM_TjifBPC9s-IVFvtF0tzhf2i8O5u1sZ9WbOaP-X616tWP6KwEMygO_TJRTHd_GktCJUOflbtxS2fDgTVbKEa7DeARpBac8qbaYWflgXDRHWQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjAkMdL61-XV4FcSh8apS-BpWFr7fnpZmSvRg1NPzkyjOM-5IXHAyAOKVgG_28I4Rzb22DUEoLICQ4DqY_ZxbTu80tjkCKb8gHuUVkegUQ4rxjKZyG-bq0zpjGx5cTSTg6O4LxZrC0_SOcpKg_0=s4800-w800-h600"], "a": ["Lars Kröger", "Markus Enzinger"]}, {"c": "landmark", "n": "St Mark's Campanile", "zh": "the bell tower", "must": true, "lat": 45.4340359, "lng": 12.3390331, "m": "4.7★ · ~€10 · 9:30am–8:45pm · lift, no stairs", "d": "A 99m brick tower rebuilt in 1912 after the 1902 collapse, with a lift straight to the belfry for the best view in Venice — lagoon, red rooftops, and on a clear day the Dolomites. Galileo demonstrated his telescope from here to the Doge in 1609. Book the first slot of the day to skip the worst of the queue.", "g": "https://maps.google.com/?cid=12557975345209556468", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAVhrQxkxcTsHpPcTLxNdIFNOcAY4BBcvjscY0LQ24D_QiO72qb7uFjPpqibArcHT0rp_OsSY5jUTjj50U3deHYl62Hqv9BtXYvyCcaUb_NRisDWf0necECyrW--wCTF-ceDa_iJplSC0PITg=s4800-w681-h450", "https://lh3.googleusercontent.com/place-photos/AG9NLjCSbBEh13xAPEmP6QSYpSR45wqFe1WmjQiby41GOCKM4aV58izvBUA-kaQFnub8TvMTiKD-hG1UuuDp6o2WZ16PmjrxdZIL9yHNPZSQ2bZ3FYI4E2jRlO-MJzuBtAXN38xp65yMzTZOq40PfcE=s4800-w800-h600"], "a": ["Sindhu Gowda", "Laurent"]}, {"c": "landmark", "n": "Bridge of Sighs", "zh": "Ponte dei Sospiri — viewed from Ponte della Paglia", "lat": 45.4340496, "lng": 12.3408544, "m": "4.6★ · view FREE · interior only via Doge's Palace ticket", "d": "A closed limestone bridge of 1600 linking the Doge's Palace courtrooms to the New Prisons, best photographed from the Ponte della Paglia just to its south. Lord Byron named it for the sighs of condemned prisoners taking their last look at daylight through its stone grilles; walk across it yourself as part of the Doge's Palace route.", "g": "https://maps.google.com/?cid=8851216212410504400", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDeXgvaaPB9OAerX0VAWdMae7zG23IyqlxbMOGYMgZZCuQhhXZxnNkW8QW3EWIhN2P2iMQdj4ATNgNfCcaueF-sFhOPaHuGxUzq7wXlitlwreKzWofbGLazCo8Ul33K4Y2NjpDbN4VyxiNruA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjD7TfT5UimsTN2f5-9e49uiAMhTH54ysgBUamGxA3-LKgcW-77qN3Szqz7yJmKotgxhiRf9vFWU5ETwFLCu3wDZCuqXzj8LMdk4hv9jA69gLjS3-u-AJJV-omnZVJbB9vkZigcI265N7axUCrM=s4800-w800-h600"], "a": ["Jayde Müller", "Dario Grigoli"], "s": "Giacomo Casanova was held in the cell block across the bridge in 1755 for 'public outrages against religion' and, by his own memoir, escaped in 1756 by cutting through the lead roof — one of the only successful breakouts from what was meant to be an inescapable prison.", "sl": "Casanova's rooftop escape"}, {"c": "landmark", "n": "Rialto Bridge", "zh": "Ponte di Rialto", "must": true, "lat": 45.4379842, "lng": 12.335898, "m": "4.7★ · FREE · busiest 10am–5pm, quieter after 9pm", "d": "A single stone span of 1591 that replaced a wooden bridge collapsing under crowd weight, chosen over designs by Palladio and Michelangelo in a public competition. Two rows of shops line the top — mostly jewellery and souvenirs now — but the real reason to come is the view straight down the Grand Canal's busiest bend, best at sunset or after the day-trippers leave.", "g": "https://maps.google.com/?cid=8295649897501084809", "p": ["https://lh3.googleusercontent.com/grass-cs/ACvplmPaZ4WH_q0dLy7jpLvwJ5HyqVm7kK4CDn_nk-VrA0y3Zy_ebaeoDJ0-NfPJC1KwLlDFd6E4PZNZ-zdCif-1VjyQME8AKaCQAV9HfBrimEvB-jyWU2qqwkCSWzwThhHVvyji7avD9ldkTCLl=s4800-w800-h600", "https://lh3.googleusercontent.com/grass-cs/ACvplmOx1mpZqscAtbYtNi9v2SvXg1nJkq8npACUiErJlka5aMzYHKm4Y-8aj5M8iasRthCnQ7an8OfUl7aIQFCnU_JRy7UJTwYukPs-5l7wq3yL7JslTF6as9SGwmgVqmFz-nq5zG3UgH5nsaiM=s4800-w800-h600"], "a": ["Strahinja Mladenović", "Araceli Ramirez"]}, {"c": "landmark", "n": "Torre dell'Orologio", "zh": "the astronomical clock tower", "lat": 45.4347587, "lng": 12.3389668, "m": "4.7★ · ~€14, guided tour only, book ahead · 11am–4pm", "d": "A 1499 clock tower with a blue-and-gold astronomical face showing the zodiac and moon phase, two bronze 'Mori' who strike the hours, and a gilt Madonna that two mechanical Magi parade past each Epiphany. Only visitable on a pre-booked guided climb up steep internal stairs — not a walk-in ticket.", "g": "https://maps.google.com/?cid=9802050146845820385", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAFS-cxu6uf8ua6VwxdMqUSPp0JvCCOk4hvy2oYA9UbEgWUR2PKsIjjvpFqZQzylULv1VcsV_-2-kfLaJ4lJNMBmfqonIH457YYBSw_AHZxkgWVrH-yTM1SyT_0HR0gRz4ttyuKXrau74h_0y0BmH-NvQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjABoAT152KIU2_qKDY33NyDtz0yHacnBn_VKKFstxXINzBPyxrgToxXyCvippoxp6yOJrsr6b__25bQ4G1tv2ECQz4aRnpqCckH7qaVhuJFlZjKxY6FRAe-0_QmqhNiB16xK2GstmeeqhX4oic=s4800-w800-h600"], "a": ["manu nd", "Juan Soto"]}, {"c": "theatre", "n": "Teatro La Fenice", "zh": "the opera house", "lat": 45.4336376, "lng": 12.3337579, "m": "4.7★ · ~€12 self-guided audio tour · book tickets for a performance if you can", "d": "Venice's opera house, named 'the Phoenix' for good reason: it burned down and was rebuilt in 1836, then again after a 1996 arson attack, reopening in 2003 to the same 18th-century design. Verdi premiered Rigoletto and La Traviata here. Daytime visits are a quick self-guided walk through gilt boxes; an evening performance is the better way to see it lit and in use.", "g": "https://maps.google.com/?cid=2927930797892118042", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAKoqVK6Yb8YE9V9omDFtYrDPWuIkpcCym1WCSRtmT-q3uiPqBqJEoGQlQ__R4gK4afKjEaeaivPk2-P7grX76kqyu2VV4Ic4p8VQZYszH46gsxE0QT0DovrMxhDhvHUFhYGHjeBlAvYuvRIoLvLFyQPQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCT0444O4u8G4YC_h_eRruA7S9p0t0PEjypJdHgFRq_qWKLzjN3qqOEdXxAehD0slLky4TNG-Sw8SpZGKX9R94WE8KFBspIcfvTMpJpcwXT-rOVD1f3HBoZj3TOt8lo2AUhJ75pNIHeqfZgyg=s4800-w800-h600"], "a": ["David cc", "Cheuk Lam LIE"], "s": "'La Fenice' means 'the phoenix', and the name has been tested three times: fire destroyed the theatre in 1774 and again in 1836, and arson gutted it in January 1996 during a contractor dispute. Each time Venice rebuilt it to look exactly as before — the current hall is a faithful 2003 replica of the 1837 interior.", "sl": "Burned down three times, rebuilt identical"}, {"c": "museum", "n": "Ca' d'Oro", "zh": "Galleria Giorgio Franchetti", "lat": 45.4410116, "lng": 12.3341663, "m": "4.5★ · ~€10 · Grand Canal palace", "d": "The most delicate Gothic facade on the Grand Canal, its tracery once painted in ultramarine and gilt so the whole palace shimmered. Inside is a compact collection anchored by Mantegna's St Sebastian and a courtyard floor the owner Baron Franchetti had hand-laid in marble mosaic himself. Quiet even when the rest of Cannaregio is busy.", "g": "https://maps.google.com/?cid=3803050549084779436", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBsL4sQSQ58M198zQJ54s1LTI_VCrW7rrQlxrqHWZyRMgJ48UNoBuEqa1wbvCslEk1HObvWIk19m1ZvoxE1JmPSjIgPbO70xXEBdMrmvkkM7exq64MyAx3vuqxuVbpkfgyINj4mn1NXYC1SCg=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBA0Ohu7K7wncEbX2fvklZx0p5pHzU6DvrduDenufzrt9gaEmhSnasR_62rklry_Zi7AuOYZR-5WmAGdHTiQkVqVog_5tIPgVXE7ahXlKTBSehEofM6-VIfLsTquPKxQqUcBYi6JuehEAvo=s4800-w800-h600"], "a": ["Salim Hashmani", "Maurizio Costamagna"]}, {"c": "museum", "n": "Scuola Grande di San Rocco", "zh": "Tintoretto's masterpiece hall", "must": true, "lat": 45.4366549, "lng": 12.3254746, "m": "4.8★ · ~€10 · 9:30am–5:30pm", "d": "A confraternity hall Tintoretto covered floor to ceiling over 23 years with more than 60 canvases — sometimes called the Sistine Chapel of Venice. He won the commission by secretly finishing a full painting overnight and donating it, sidestepping a juried competition; the upper Sala Maggiore ceiling is the single most overwhelming room in the city. Bring the mirror-cards by the entrance to save your neck.", "g": "https://maps.google.com/?cid=11245148439453682017", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjC_5cEiCIy5lZ9pDwQoziim3IKnm3U6y4cUdVHk8_729LLt60KN7hQqVl61GVaQJ66o8EsryN9VeIf29hYetQCBvI6QCFfSCTx9xX0ouv7vPbaImcn_H50EUlv7JZMEO9FluILK2Vf-nC2k6gk=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDfgVQyKAB7WgySKs-gaGhin3qL64Aae4_VwnHjW2elVaJtrDQoYgOutKU1rPwQbHoxg1EiGHnh3rWeQzr3S4f4BjJu852J-yNGog1jBftz_22gwSR0dIQy0bIVm3SA4cd-RP5WhEv0gY5y0Q=s4800-w800-h600"], "a": ["Bad Boy", "Cinzia Caruso"]}, {"c": "church", "n": "Santa Maria della Salute", "zh": "the plague-vow basilica", "lat": 45.430675, "lng": 12.3347626, "m": "4.7★ · FREE nave · sacristy (Titians) ~€6 · 9am–12pm, 3–5:30pm", "d": "An octagonal baroque church built 1631–1687 as a votive offering after a plague killed a third of the city, its huge white dome marking the mouth of the Grand Canal. Titian altarpieces hang in the sacristy for a small fee. Every 21 November a pontoon bridge is laid across the canal for the Festa della Salute procession that still gives thanks for the plague's end.", "g": "https://maps.google.com/?cid=14553924735225112415", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjC_7unoIc8k5r5zrhsfGNF3eEW_v_9SVgUOUCqhlqTKMQNKZi0WbU0t4amzLPDAELUQhqQBeZLj7RSu7rhKvx6Z31Riq3AWpBDNQV_jN_82kdXsjDdHLcwToxWQfhHfVoKA2EbARxFCI0co0A=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjAKWfzXcPR-XukV1OPpjFpBR-Wu1fhY0J2TGuUG6lEA_Q_9WCYBRYvDTfAunpDHHI7hmsMLlIY8PIVjVr8jr6AfVclXEEZH_-Hn49VtjsYec07YNUVzwz_4M372KkwJB-N4kQZKlrWD1WyRhQ=s4800-w800-h600"], "a": ["Benoit Guénette", "Михайло Романюк"]}, {"c": "church", "n": "Frari Church", "zh": "Santa Maria Gloriosa dei Frari", "lat": 45.4369864, "lng": 12.3266004, "m": "4.7★ · ~€5 or Chorus Pass €14/18 churches · 9am–7:30pm, Sun 1–6pm", "d": "A vast brick Gothic church that reads as a museum of Venetian painting: Titian's Assumption blazes over the high altar, his own tomb sits nearby, and Bellini's triptych in the sacristy is one of the finest altarpieces in the city. Canova's pyramid tomb and Titian's are both here — two of Venice's greatest artists a few steps apart.", "g": "https://maps.google.com/?cid=6105269270287809547", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDg_tGrltaRDRYDdcyW5ondpKsBsra4nYe7joZ2oQ_uz8u_UjYpdtI3MJAGZoUaY_4gcW5ShqBnPtn4C5MlvWe8dpoCg7apisQT3WBCteVERiWMfAFGfhD3XJ7-ZghmLWimxukH_G_t43dR=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBpt2F-Q5h6Q_HxFYV7Ch-DcCR9abz0Ib1Omf5wqIgOskNW-Nfygc_ZvfEq_q5AN9O36QCVvQY3DYRmjoqzqhQ5zCV65MiFnhQtNL_JEuEo-p6DjbLJB95KToOZYDV3nOZxZnpzY0w7BsgpC-Y=s4800-w800-h600"], "a": ["Miroslava Klimešová", "Michael Ball"]}, {"c": "church", "n": "San Giorgio Maggiore", "zh": "Palladio's island church", "lat": 45.4294192, "lng": 12.343204, "m": "4.6★ · church FREE · campanile ~€8 cash only · 9am–6pm", "d": "Palladio's white-marble church sits on its own island facing St Mark's Square across the water, a five-minute vaporetto ride from San Zaccaria. The bell tower is shorter and far less crowded than the one in the Piazza, and gives the single best postcard view back across the lagoon to Venice itself. Lift access, cash only at the door.", "g": "https://maps.google.com/?cid=10378547147295904525", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBPUcshXt0H76t8TOgGgP3m9J1BnPwlyX7dKs_CVswT8GD-ikGUgNH5dTgK7By9AKMglQ7FOuFJ9o_LGyQln7zyNJgxBcNy-pd8z1ctTEXPtFP8Q_HAXuCXKgakvhEMC4XDn1bkTiA9E21INw=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjClLmq_nc9EuFuLIO56pTLRsGLrAFXXx1-pUf-KyfRYKVgEbgeG788l6u-Oxc6uBV6cdJ7vzUSCTLPaxuTtDYalEHX-AEyyrIbpzqzExvSgOr9ollcjm_L7WDkOBU_zVL7F9Le4K56NGU6q=s4800-w800-h600"], "a": ["Jeanmarc Mauron", "GZ"]}, {"c": "church", "n": "San Sebastiano", "zh": "Veronese's parish church", "lat": 45.4320049, "lng": 12.3199577, "m": "4.6★ · ~€4 or Chorus Pass · 10:30am–5pm · Closed Sunday", "d": "A modest Dorsoduro parish church that Paolo Veronese decorated over 30 years after fleeing Verona following a fight, covering ceiling and walls in his own paintings rather than someone else's collection. He's buried here, near his organ. Almost never crowded — the opposite experience of the Accademia ten minutes' walk away.", "g": "https://maps.google.com/?cid=16685578704052860151", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjB3e7_3GjYT1iRA3N1w2ECzvAXSos7XlGw3qCLf65t5cgl0FNi6nW2Tyh1ZTOtxeWhFs-fPMwkZ9wOwC4XH-df2hvFJZfj9k2kyofxNjLjfBqYuas6x7ZSy0aCqyEKJzT0nlbl9X511zsqY=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjB_3QdAqo-9JjCfyac6WGiYQgwk11AsUvf63JX80ZFxqJ5iFEAb13t5AI2hw_i1NP3OEm5sKqTg-_j_BvMG_KkvZYYHLKW2hagKzbT6rr5RY3SKi-_3qmGB7Ea23eqKIUIcYEPeAyopQr3GRlkIP2chpg=s4800-w800-h600"], "a": ["Pietro Bruno", "イタリアとドイツ公認ガイド"]}, {"c": "museum", "n": "Ca' Rezzonico", "zh": "Museum of 18th-Century Venice", "lat": 45.4335405, "lng": 12.3268258, "m": "4.5★ · ~€10 · Closed Tue · 10am–6pm (Fri–Sat to 8pm)", "d": "A Grand Canal palace furnished as it would have looked at the Republic's decadent end, with a frescoed ballroom and paintings by Tiepolo and Canaletto. Robert Browning died in an upstairs room in 1889. Quieter and less picked-over than the Accademia five minutes away, and included on most museum passes.", "g": "https://maps.google.com/?cid=13797895796291403101", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBsL4NuWTa2Oka90LgVcCrdXlyeCsfYzYJopm9h3gthXFuU11agd93Y_11qTBrsRKS47aI9I9rS83AnZt2i41u1MrZZDGIujD7slo3d8tgDSci_8UpJBv1Z6eytk1KarOVvXXeqOD1cS48NVQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjC6H5ctQI59H7w0vyHtGSQGUlgR9lgPz8yVzRKeeCEFciCUECMgc_7gRWQqhhuEostTCK6Z9oicCoIvIOy-Q7mFnds09AQSBSfAAnc-cwu_E3zHKT0IDva9GKJevZdPo661GEgkD8qBDi3vTnZoneAF=s4800-w800-h600"], "a": ["Mario A", "Michael Offord"]}, {"c": "museum", "n": "Gallerie dell'Accademia", "zh": "the Venetian painting collection", "must": false, "lat": 45.4310784, "lng": 12.3281394, "m": "4.6★ · ~€12 · FREE first Sunday of month · 9am–7pm, Mon to 2pm", "d": "Six centuries of Venetian painting in a former convent and art school — Bellini, Giorgione's Tempest, Titian, Veronese's Feast in the House of Levi (once censored for showing dwarves and drunks at the Last Supper). Leonardo's Vitruvian Man is in the collection but shown only occasionally to protect the paper. Free on the first Sunday of the month, which means busier.", "g": "https://maps.google.com/?cid=14643976318688368491", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCwtTUJ7AKpa_m8arWNrkH_HQtqBhzdGGyfnJ0T-JStJb1J3IDJ3VqfLpe9PQXCWFY3FZGfwbBXOqV_9VP_YqT4m41Uq-n9i-hi_Lv_utiRKmI0UeTwlIZA6g6rEV6hAUkMyJwbparFvOodSRo=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjD6mSe4UI0SAx53jF7Uo9oYNXcS-ZFnZrtplhNwwDJO_UkAuorxJ59iykzNUPS31d0JHs9gXlYBDjIXALIwIj1GK-YXMvRL1BrwpEVQ7BpeRbi6cP8-0VHmwGbzQYHha8YPlHPL4-4YfDgCiGVjhuvfcw=s4800-w800-h600"], "a": ["Gallerie dell'Accademia", "Ilona Ignatjeva"]}, {"c": "museum", "n": "Peggy Guggenheim Collection", "zh": "20th-century art on the Grand Canal", "must": true, "lat": 45.4308209, "lng": 12.3315374, "m": "4.6★ · ~€16 · Closed Tue · 10am–6pm", "d": "Peggy Guggenheim's own unfinished palazzo, still hung as her home rather than arranged chronologically: Picasso, Pollock, Magritte, Kandinsky and Max Ernst (her second husband). Marino Marini's aroused bronze horseman on the canal terrace is detachable, reportedly so the phallus could be unscrewed for prudish visitors. The garden holds her grave alongside her dogs'.", "g": "https://maps.google.com/?cid=16412963555057551853", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBYk5dhRr-MgEG0Hfs7AFCox2LtyGrDa8K1fZpy1bpFnSzILyWUBOQwXHs6YIhgF7SV5bGzV7E2Q3yV0AdztkZVGvLZ_74P1XUfhL-LhEAQ8CpfEBDe7mJ_bj935Y16NvjQyMaNDNjO4ShdxA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBN0CDIIioTMCxCdJZbjWjWXb86NX-hoSoMd7IGnBMCiQ7rcH98IDQap-0wrxw_LV5oI6EfN3I_anu8_7D2tBZAuWVB84dwj9RvSr1RAfgwHBnX4e3K4SFRWu7Ye3JmSy-tgvr4NRPBdgB5QUL_6Me40Q=s4800-w800-h600"], "a": ["N G_MISSOURRY", "Aliaksei"]}, {"c": "museum", "n": "Palazzo Grassi", "zh": "Pinault Foundation contemporary art", "lat": 45.4338015, "lng": 12.3279463, "m": "4.5★ · ~€15 (combined with Punta della Dogana) · Closed Tue · 10am–6pm", "d": "A neoclassical Grand Canal palace turned contemporary art space for François Pinault's collection, rotating major shows year to year. One ticket also covers Punta della Dogana across the water, so visit both in a day. The building itself, restored by Tadao Ando, is worth the entry alone for the calm concrete courtyard.", "g": "https://maps.google.com/?cid=13487715944755964066", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAl4ad70w_zyl6ZU1DaZePIxzHGsKBnqqjs4W-MKgxPQKDCfKHJl5Hz1ZlAgFB8dpFwdHX_juSLHVW_B-O4WXek1WDk8OT9NfjLD4RFVF7mfRjzFBdspKPP9Pr72JBQ3qUTc02w_UwR2-rtqw=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjB8ZdQ8dIM-Zfq8tktAWcnjCnFVpJ_jvh3_VUTMavBp-B8tcRgcxlHNJ4QpAO6GXACZfN8DN-D91usoPDe7g2OCi_CSYFlD3YAUNz2O-8oMZyeQchab7lNVRyQMfdzIzkd-yBxet3t-qAD5NQ=s4800-w800-h600"], "a": ["Pavel", "Palle Frens"]}, {"c": "museum", "n": "Punta della Dogana", "zh": "the old customs house", "lat": 45.4309476, "lng": 12.3368328, "m": "4.6★ · ~€15 (combined with Palazzo Grassi) · Closed Tue · 10am–6pm", "d": "Venice's former customs house, at the very tip of Dorsoduro where the Grand Canal meets the Giudecca Canal, converted by Tadao Ando into a contemporary art space for the Pinault collection. The building's triangular footprint and the view from its point — Salute on one side, San Giorgio on the other — are as much the draw as the art inside.", "g": "https://maps.google.com/?cid=7094032942764439405", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBsDBcDhOxvbQv_oDuFZ3uVbPTHbKxedvYbJrM1l2k1rmO3juA2zdC64b4afNaJFRzs8232mAZ1mlMx0gb131PDJVwVmdPTzMI94ow2m2eGaYfu61UNV9ncVicPuLmIlmBznO3FLTYXSlhdaQ=s4800-w800-h500", "https://lh3.googleusercontent.com/place-photos/AG9NLjAd7oCVwSAdRxkThn01KjeWGOi_qm_GB0QIQ-drTiL3e6A-xX7NYhsbaWfRnM0zN_eat1SXr3d9ify-UCUrPpuyCmXHiQ3OXIBSNPOkgcwlMlbLsdRwh7CMKotdRYVEUEomUTNBhAXHnHzX=s4800-w800-h600"], "a": ["Punta della Dogana", "Punta della Dogana"]}, {"c": "museum", "n": "Ca' Pesaro", "zh": "International Gallery of Modern Art", "lat": 45.441063, "lng": 12.3316317, "m": "4.5★ · ~€10 · Closed Mon · 10am–6pm (Fri–Sat to 8pm)", "d": "A baroque palace holding Venice's modern art collection — Klimt's Judith II, Chagall, Kandinsky and a top-floor Japanese and Chinese art wing bought at the early 20th-century Biennales. Smaller and calmer than the big-name museums, in a part of Santa Croce most day-trippers skip entirely.", "g": "https://maps.google.com/?cid=4422538451120496018", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAJaVLELwenX2LHByHR3dVZ8yPiiqFexBuHzvek1v_709wyvEDmtYx7sx5NTWcNZxFLFMsW-zjXzBMCcone16QyblDtkq6hHNNW8rEKUTx-u7SUYJqVYwF66MUzbce95ZX_Otv-NiGvXOJS=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjB0cYHb6LuBiovj5q4VCizw-tpR3EHqC3lxwTDsOP_gEc-G533aLVz-c7BJRsGHLUB3ACG0qhiqrjd8ObniIIp7wniy8YpX8eM99Vp1TbO0zn99EkDebHlFFGr1IzbXNa5l2vnunk2kbphj=s4800-w800-h600"], "a": ["mihai voicu", "Gabe Iglesia"]}, {"c": "museum", "n": "Fondazione Querini Stampalia", "zh": "Carlo Scarpa's garden museum", "lat": 45.4367187, "lng": 12.3413818, "m": "4.4★ · ~€14 · 10am–6pm, Closed Mon", "d": "A patrician family's home turned museum, with a ground floor and canal-facing entrance redesigned in the 1960s by Carlo Scarpa — sliced stone, water gates, and a small walled garden that's one of the most peaceful corners in Castello. Upper floors hold 18th-century Venetian rooms and rotating contemporary shows; the café spills into the garden.", "g": "https://maps.google.com/?cid=17219824973277900701", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDcB9pecR8iTqd_1mTxrL1gF4LOBmt5WnQ_0H28ZyJyV1Wmzu0D73DNkjgiTITur-7xmYf-pDRWNUTOCbPlLEkMDgb7jVirM2w_BFf6c6MmvA_0xBxnSokeZthZhA20et-c6OgUeEpVDxSGEg=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjD0MhwFX7V5yoh4Q-UbIw279ysnMtrbln9aCigXxvGyReKPb97fHoKMa3cu3__EU8FmCBJR0T36RG0b-c_nnVXSOe8QMrzQWb5Mz3dS-woAZ6TK649BklEI8oQ6rHRaK5bKUAIIT2oqCtYmgQ=s4800-w800-h600"], "a": ["Fondazione Querini Stampalia", "Piotr Modliński"]}, {"c": "jewish", "n": "Jewish Ghetto", "zh": "Campo di Ghetto Nuovo", "lat": 45.4453337, "lng": 12.3263657, "m": "4.5★ · square FREE · walking tour with synagogues ~€12 · avoid Shabbat, shops close", "d": "The world's first ghetto, established 1516 when Venice confined its Jewish population to this island around a former foundry — 'geto' in Venetian dialect, the origin of the modern word. Tall, cramped apartment blocks still ring the campo, five synagogues hide behind plain facades on the upper floors, and a Holocaust memorial relief lines one wall. Closed Saturdays for Shabbat, including the museum and shops.", "g": "https://maps.google.com/?cid=13077145684199074312", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAix9Yq_THqmW1cAyJTOVnTHe6W4nyDlfpbNgZoeGuqnHPRyZHn8lSEvDfr1RFzrwH8eY55g8I7h-0dJHehNzbmLfjU0XK3sPRPkJwN5F7b38LcoJVuXh0KJvrjYMOEaWHHcvKu4GNJ-ZuewA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjA_85egz-RFDP1WWcoRViyDyZTtyDlhQbzlp6PLDLFUmE0lVjp1b10CwNyKnBFcNVhd5RoyHp_xpyfrWh8Ql7lyVZ_mQrEf9J7X1QlLvl9X2KJl8Mzmop-8PGApZfD8ism2uRSWkU7lAtigLA=s4800-w800-h600"], "a": ["Rena M", "udy hershkovitz"], "s": "'Ghetto' was originally just the Venetian word for the copper foundry (getto, 'casting') that stood on this island before 1516. When the Republic confined Jewish residents here that year, the word for the site became the word for the segregation itself, and travelled into every European language.", "sl": "Why the world's word for it started here"}, {"c": "jewish", "n": "Synagogue & Jewish Museum", "zh": "Museo Ebraico di Venezia", "lat": 45.4450297, "lng": 12.3269441, "m": "4.3★ · ~€12 with synagogue tour · Closed Saturday", "d": "A small museum on silverware and textiles from Venice's five synagogues, but the real reason to book is the guided walk into two of the working synagogues upstairs — the German and Spanish schools, tucked invisibly into ordinary apartment buildings from outside. Tours run in English several times a day; check ahead, the museum itself has been under partial renovation.", "g": "https://maps.google.com/?cid=16268658631883393332", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjB0lLXoneQ6PzNfSnO4t5zkI6D_XHlCob4Wt57AbGJQas20ZnOFBpGIHb-uQHuYG1u5prxehicurDMdjuks7axwEfloKaHYPWfAgFnK_qqEUkMMcNqB6_JxWecqlBKAZDJdybANhc-WZH3rIuM=s4800-w604-h436", "https://lh3.googleusercontent.com/place-photos/AG9NLjBbI-ZE3ndvXsjcHINS64vxRYosm1EyCXBSK7Ri12P50h7IkCq_-p88_OWl6LwLmxt7XuYvaVso5-XTZ8GuuBFV4pRzCrWzTYpxmiSm6U1_d5wYxbrAXI2Jv8TUSJNVMl6EWlcCDKK4YpFUUIA=s4800-w400-h316"], "a": ["Sinagoghe e Museo Ebraico di Venezia", "izzet var"]}, {"c": "district", "n": "Campo Santa Margherita", "zh": "Dorsoduro's student square", "lat": 45.4342612, "lng": 12.3238414, "m": "FREE · liveliest 6–10pm, market mornings", "d": "A long, irregular square near the university that fills with students rather than tourists after dark — cheap spritz, a fish stall under a green awning, and benches to sit and watch Venice's actual daily life instead of a stage set of it. Bordered by bacari and gelaterie rather than souvenir shops.", "g": "https://maps.google.com/?cid=1075234919329922575", "p": ["https://lh3.googleusercontent.com/grass-cs/ACvplmMjPyUKCNr7xCMyUAHZ9MAqMa1QIkpXyy8zJ3_MmXaYe4NPqxRxF4FrKGR865zWNLmCXtwiDAMnDAkpUfma720kvTjVnU2xi6DQKhrIBmhV50RjH6_JmiX4Ws1-0K6PGOYJcaIU=s4800-w800-h600", "https://lh3.googleusercontent.com/grass-cs/ACvplmOI3Z3yjMs-b4jgQv4Az1CnnUuQoi2i_JAGhvuLHUcr8mRvNG_XH3QOnpUJBSqdWrhHCcrFz-dpbCZxI71j_T9Neh_1sRxZQCyKu0490eEC2zAL9CNFfv9oMRGo_y4qxA8BLlin=s4800-w800-h600"], "a": ["Franco Tessari", "Wael Kharbotli"]}, {"c": "district", "n": "Zattere", "zh": "the Giudecca-canal promenade", "lat": 45.429801, "lng": 12.324853, "m": "FREE · best at golden hour", "d": "A long sunny quay facing the Giudecca Canal, once where salt and timber were unloaded, now Venice's favourite place for a slow evening walk with a gelato. Wide enough to actually stroll rather than shuffle, with unobstructed sunset views and none of San Marco's crowding.", "g": "https://maps.google.com/?cid=15908196936170605636", "p": ["https://lh3.googleusercontent.com/grass-cs/ACvplmMqBPe7ncoCOEIGdFjXhJBZtl98sv5tgEnVDXwn0fTzGH3p34Ctj6v26-h9vCf5G94mJLO2ld8WDwS1CBkgAqgklWxWhjZ3RwwHPo96ZTk0dNGCqPvM2I2yVuwAOphlTWYD6XEHhw=s4800-w800-h600", "https://lh3.googleusercontent.com/grass-cs/ACvplmO_udQ9QOjZ80Zhe6JBoDsiUfOi02LqhQpHv1LrBbhTNwpuaaZ_DOn5hbbACDr9egWrtXatGhaO_LBKFeKc4lMtvVu7pBS5s7a8REr1qwF647G452xEYVhUQXE0PmUD_7TR=s4800-w800-h600"], "a": ["Elias Cayuela", "\"Inkomix\""]}, {"c": "district", "n": "Squero di San Trovaso", "zh": "working gondola boatyard", "lat": 45.4302714, "lng": 12.3258886, "m": "4.6★ · view from the canal FREE · guided 30-min tour by email booking", "d": "One of only four working gondola boatyards left in Venice, its wooden sheds looking more like an Alpine chalet than anything else in the city. From the opposite bank you can watch gondolas being built and repaired for free at almost any hour; email ahead for a short guided tour inside with the family that runs it.", "g": "https://maps.google.com/?cid=4254424658832429224", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBKdN0fxtAewp9DkvoKnfFWC5iQ8LHrfXcsa6WTpifpy0-CFRVe40y8k15SkOVgIdpRB45pr8jYPxi9J9bDYq0S0NKUCOuf69UlFCNbqP79ZvxDceKHgwm64nsIlsRBis5h4fKl_DfIK_UexYA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjA9cp4XaWDY3u01eerzwK8VXddJIm9mIBvHSpGMR8WyiueLg7CAiUXe_uvw-VqARldt--0YK8j7hf0pcQFdyF9hmL4ZwM-vFh2v8cuNUX7MuBjmeJYTO291SQ2WUr0O-W3AXstNPBK4UOBclw=s4800-w800-h600"], "a": ["Thomas A. Pointner", "Gianluca Terenziani"]}, {"c": "district", "n": "Libreria Acqua Alta", "zh": "the flood-proof bookshop", "lat": 45.4379806, "lng": 12.3422891, "m": "4.4★ · FREE to browse · 9am–7pm", "d": "A secondhand bookshop that stores stock in bathtubs, gondolas and a full-size boat, a practical response to flooding that has become the attraction itself. A staircase of waterlogged encyclopaedias out back doubles as a canal-view lookout. Charming, but treat it as a five-minute photo stop rather than a serious browse — it gets very crowded midday.", "g": "https://maps.google.com/?cid=10014333886104451460", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAAIjwjtHkGaBSyCBXc0zM21bdn5WT9hDXTtNqKyGMp_nWkUmp9P_mALDCjQSj3SnhYWnZkjgcOIGNZazgvICy6znh9x6iz31WPva91bsa7wDP0_daneo-dVLX_FYn9kbyIeMb9kk-ogjecoA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDf3yUsMASdJr-tuS0q4NoQRW7aeBaqLfsDX7yXlu7RCvs_tL9dfYpfJ6YlZkwHImp9fWm74xzRWkcajTPNhYVoTXq8PcKqz0NvdKTuKtfpiMpnl3VvYAWGn4nlIWxE2VxCDtrNC9sAcl3I-72Oc21r=s4800-w800-h600"], "a": ["Libreria Acqua Alta", "Monique Campos"]}, {"c": "cheap", "n": "Cantina Do Mori", "zh": "€ · oldest bacaro, founded 1462", "must": true, "lat": 45.438995, "lng": 12.3340309, "m": "4.4★ · cicchetti ~€2–4 · CLOSED SUNDAY · standing only, no tables", "d": "Founded in the 1460s and the bacaro every other one gets compared to, hidden down an alley off the Rialto market with copper pots hanging from a low ceiling. Order baccalà mantecato on crostini and a francobollo (mini sandwich), and ask for wine by the glass — an ombra — the way merchants have here for five centuries. No seats, no menu on the wall, just point at the counter.", "g": "https://maps.google.com/?cid=17938916495438166107", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjB4m8MF4UA5gVcv7z1Y9lZSoRPhQ2V79TkWyLqjnudvHuKv2BUdZ7AY-0qwgAEgclCqvusXmo8NSx6Mz4wMW1khyvE-XYulukffMPAh8rrIJVFTiO3JbsUZ69mcHWfM6VDPW3O0N1LmTYofxmstAOmo=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjAmcYhSwYXO0V7OvTEWfjRMks92sl18clt3F70p4NXhM-PP4-eXH3J6_TUfZSpoFGSGsixyImlGgNyArDr4v086VoEEyLUEJm71-o13jjy_haxF_bLm52gwXFUrchz35B8CAYQaqAM9EMmg=s4800-w800-h600"], "a": ["SA CCJ", "Matteo Ruggiu"]}, {"c": "cheap", "n": "All'Arco", "zh": "€ · cicchetti near the Rialto market", "must": true, "lat": 45.438892, "lng": 12.3340577, "m": "4.7★ · cicchetti ~€2–5 · CLOSED SUNDAY · 10am–2:30pm only — no dinner service", "d": "A tiny standing-room counter steps from the Rialto fish market, run by a family who shop the market each morning so the cicchetti change through the day. Ask for the gorgonzola-and-anchovy crostino and whatever fish one just came off the board. Arrives busy by 11am and simply stops serving mid-afternoon — this is a lunch stop only.", "g": "https://maps.google.com/?cid=5723557145174955421", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjByZKuuiJ3xwWWwPVCA3Gkcy0BKXR3jJIOBAA6K33vGFIaqHKinNfn9Pk8sShM9OzKGZUpHKN1kBjnDN5iegV8jd57x5F2nfya7eV7XhlDOJToOWfBsSXxMUzMD84c7XjzTqxfG3ryl7UIq0w=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDa4F572YK11VSSR-Fsk_GaqWX9Vxbb_ZtKLc12u_DHuXJHUYyWTS__4PF_thWUwPtE-4pIFWIRzK6fcZB7JN41fESdJUqD69qwmTEsL8nGzvopR-pDdKDpq_xBa443qsTz38XHeU1a0R7-Fw=s4800-w800-h600"], "a": ["Simone B", "Sotiris KD"]}, {"c": "cheap", "n": "Cantine del Vino già Schiavi", "zh": "€ · canalside crostini and wine", "lat": 45.4309335, "lng": 12.3267112, "m": "4.7★ · cicchetti ~€1.50–3 · house wine ~€1.50/glass · CLOSED SUNDAY", "d": "A glass-fronted counter on the San Trovaso canal, opposite the gondola squero, with dozens of crostini types laid out and no seating beyond the low wall outside. Locals drink here more than tourists despite the view; watch for gulls stealing food left unattended on the fondamenta.", "g": "https://maps.google.com/?cid=11308555892529005896", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDOt5j5RVVcCQNKl8qbeUjHhb3Z0Yv58xxLNmkFa6d99xFdeeqjGtfeTP9ajJYe-2SLpL2TCG2PwksPr7ElwmBJcyVPiMfAQuIWG4zMu61Fz7ebncJZtSNjbTZkvuj7kUm56_-SernliPRPiFM=s4800-w671-h517", "https://lh3.googleusercontent.com/place-photos/AG9NLjD7QSW-kWaFfEOrYeDymopojuVILzPJWIVOdq_TDvKPpSBnNDfD5bSiU40uxUPqHCcvjSMaHtr9V4PxaolyIQg3W-jMxkDvGBGejEdj0Gg5Fx4H1gZ26nnUGWvM-xN_kzIYoDshalMrePN24L605QXp5w=s4800-w800-h600"], "a": ["Cantine del Vino già Schiavi", "Jane Smith"]}, {"c": "cheap", "n": "Osteria Al Squero", "zh": "€ · cicchetti across from the boatyard", "lat": 45.4301018, "lng": 12.3261331, "m": "4.7★ · cicchetti ~€1.50–3.50 · CLOSED SUNDAY · standing only, no bathroom", "d": "A cellar bacaro facing the San Trovaso gondola squero, so you can eat cured salmon and calamari crostini while watching boats get built across the canal. Gets loud and packed after 6pm; come earlier for elbow room, or take a plate to the fondamenta wall outside.", "g": "https://maps.google.com/?cid=5671231335117632730", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCE1dz3WfVzdMwBS7khUN49rUxZR1bO6I5WDDzwdnvf4HY6ZVFWKwMLQTXhULjrbIt1LbL1NTEudVrl7yDPKOcc-B_KbPRzy6hsamj7H1431GN4upoHnwLV5bddeWjG893HhlQilAkMJ0xXoQg=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDGRNIumLMLQY-F1JfuBamTc7HYyBI8YYmWY64vqCQZ-hAYP-1I4jSBMKiiXGhwNxUE8Xr25lFAAvDk0ipJPNF76PF14xTQOptuO79QfBEqkPZQulTG3PkmHZr0vwgZgUUlQuXOKOM3dPYh5fm_OdbR1g=s4800-w800-h600"], "a": ["Claudia Puglisi Allegra", "Michael Justice"]}, {"c": "cheap", "n": "Bacareto da Lele", "zh": "€ · cheapest panini and prosecco", "lat": 45.4375571, "lng": 12.3212678, "m": "4.7★ · panini ~€1.50, prosecco ~€1.30 · CLOSED SUNDAY · student crowd, no seats", "d": "A hole-in-the-wall by the Tolentini church near Piazzale Roma, serving small filled panini and glasses of prosecco for close to student-canteen prices. Sit on the church steps or the canal edge with everyone else — there's nowhere to sit inside. About as cheap as Venice gets without lowering quality.", "g": "https://maps.google.com/?cid=17352587433783482877", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDOXNO6ePSTq1CiiMMSIg6-9iPXu7PFFsrOOGzSf1_EDYQlb4gX11ma0w0wW8Oyat6sev1lr7G_8jdwBVhaGk2JtQ8iuWMLobiYFHGKo8MyKFWLlMU8_VmASv7kImQM_lW8OIyxjFihvHbf893GheznZQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDWohy8Nv5376QwEwb6dnYIZpQJtxRkVlOf6TOOIhItOpQhoNnStDQNXCDoWmXLbrB0sYZvWSuzlZoPpnvA5kXQOlxNrF5WN2UfyPAh9MM5u9GBTjOX8WdQtgKioFm0YKkB2Iu-sQ7u0lTrD0H45ZKY5w=s4800-w800-h600"], "a": ["Bacareto da Lele", "Bacareto da Lele"]}, {"c": "cheap", "n": "Osteria Al Portego", "zh": "€ · Castello cicchetti and fish plates", "lat": 45.4382342, "lng": 12.3385466, "m": "4.3★ · cicchetti ~€2–3, mains ~€15–20 · popular late afternoon", "d": "A small, warm-lit Castello osteria serving fried fish and gnocchi alongside the cicchetti counter, with house wine at around €1.50 a glass. It runs meal service at set hours, but the bar stays open outside them for snacks and a glass. Regularly filled with locals rather than tour groups.", "g": "https://maps.google.com/?cid=4993540309416496554", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCQeqtcGNKj9AMl9bR3b3f5yRVI-2CIL8oLGWMWXrBFjjSdLf8QjXfQ3O4jCwJGJaPtN1s8QuESr5FRRwka-kZZtMbTMVV4YwStOoF5Kq_57-_bhqgyuoNn4j9-WDqLIVEtBCNh_OcHYGLmdA=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCQWjs3NGHESVDMwYLWw0jur4SBIlN47r7zHe9LjyOjbiaJNqSISBx-qFxdU5VRbHmBaYFYcZiPvo3cu9KidH-yqL5RXIXWaR5X9W6XAR3mlC8A78r2B7htCURNFRqQLQeyqnK1o8kx7dQOYg=s4800-w800-h600"], "a": ["Osteria Al Portego", "Osteria Al Portego"]}, {"c": "cheap", "n": "Alla Vedova", "zh": "€€ · polpette and meatball fame", "lat": 45.4413942, "lng": 12.3345202, "m": "4.1★ · cicchetti ~€2–3, mains ~€15–20 · CLOSED THURSDAY · book for dinner", "d": "An old-school Cannaregio bacaro famous for one thing: fried meatballs (polpette) eaten standing at the bar with a glass of house wine. Reviews split on the seated dinner service — go for the bar snack rather than a full meal and it delivers. Founded in the 19th century, on Strada Nova near Ca' d'Oro.", "g": "https://maps.google.com/?cid=10957924565309733372", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCk1pi8JnIgKo42u8Xj6-0Tidh_gRDW0ICSPYTJWFRz79a1e8M2JDJwHBJhVIGwmeP2jV98rhB-bDJGWclLTliu7rj1EVMDZFFseEvlAbmAXR9cHaFhxDKyy9afdFVU3-WfaLcE9TZPLADhMQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCmsqm6cHhoAoahN3mn2wxOZ9_mChtCjVO4EyKQ_CTpuTrjqHrIDt1rvhjQCH_B-cVSlfG__eDJ3n6MiyMyYa1qdSbyJzkKh99tvdapIi3_yOHY_tGXvsaD1JVognoEyWHcynoDbnMy4fMXyg=s4800-w800-h600"], "a": ["Danilo Bisello", "天野amano0128"]}, {"c": "mid", "n": "Osteria alle Testiere", "zh": "€€€ · daily-catch seafood, 12 seats", "lat": 45.4370329, "lng": 12.3402057, "m": "4.5★ · mains ~€28–38 · CLOSED SUN–MON · book weeks ahead", "d": "A tiny Castello seafood osteria with a menu that changes with what the Rialto market had that morning — razor clams, local oysters, spaghetti alle vongole cited by regulars as the best in the city. Twelve seats total, so reservations are essential well in advance, not a walk-in option.", "g": "https://maps.google.com/?cid=13385561697127953236", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDP10dF0YResu8XRL7Ex7SPcrAVbaUULsKzouHE777AkiOzb2wtkrM01a0tgx5PR2DlCPQTSrVtihBQhP4oq8iM6bYjMCGTL83PE5bDF1DwEG--rhBpcLCSdqgjvJOBBaSBVdXWjNeSzFl7eS4=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBDMyVoUmjVfEFPxZbXsmInQmMDEeiFTLm-GeUdPeRV0qyLr5m1iPgDGk3WBe7qXm5K9CjKiF4mSj0wGSjyCwwTUcNKz9tkEVy5JPnR7oTIdfKuyjp9RzRH_yE9PA7QJ8xgIaashvc5Ft7k7cwQGDR2lQ=s4800-w800-h600"], "a": ["Christopher Chung", "Christopher Ian"]}, {"c": "splurge", "n": "Antiche Carampane", "zh": "€€€€ · no menu on the door, no t ]}, {"c": "gelato", "n": "Gelato di Natura", "zh": "€ · gluten-free & vegan flavours", "lat": 45.4404987, "lng": 12.3281733, "m": "4.5★ · ~€3–5 · 10:30am–10pm", "d": "A small-batch gelateria on Campo San Giacomo dell'Orio with genuinely good dairy-free and gluten-free flavours alongside the classics — the dark chocolate and lemon are the standouts. Less sweet than the tourist-strip chains near San Marco, and a nice excuse to sit in a quiet campo away from the crowds.", "g": "https://maps.google.com/?cid=11009634439498489792", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBXI4jrmPY9-yC0MFaUfj3W2UPNOq_vJA1N_ADpnfHd6WtpxmUsgrZ3n4ZbftIcGHnvNazqhvynzoJYq4rRjqJK9xaAPI-8b4Ukw2s7u9yZo1UKiGuDethvD1Cio1-i08hEx7AmZf0nio7Tu8w=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDgiE2uVMgvUk4wAIV2OF-sSCWh_NXi7uiZGjVJoExQoOkMaKwToIsmo8wZ8MJAuZt5qunf9KUpxgQWLTtz_KPVxsb4OJNonYsW1apxo-94ohn3QVwvzyFtcTXCjc9Tm5OFnX_X6zq9I1xIVRcE49SC0g=s4800-w800-h600"], "a": ["Gino Panino", "Sven Tiffe"]}, {"c": "cafe", "n": "Caffè Florian", "zh": "€€€ · opened 1720, the oldest café in Italy", "lat": 45.4336094, "lng": 12.338223, "m": "3.8★ · coffee at table ~€12–15 with music surcharge · 9am–11pm", "d": "Europe's oldest continuously operating café, opened 1720 under the Piazza San Marco arcades, where Casanova, Byron and Wagner all drank. Prices are steep and there's a live-music cover charge for table service outside — go once for the gilded, mirrored 18th-century rooms rather than the coffee itself, and know what you're paying for going in.", "g": "https://maps.google.com/?cid=2984251328638419091", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBH2oEJmhUuouEc6CWKmJNIieoYpALhphVP28oJS1lCDqBCAqdSepTCrDkBXcDoDCtBoDmYnWrzvmHa_X0_U8cLRHmuejJDyv5RiA8f4-OQRqwJdM12SpRS8AHUGfxAVIwbGEv2oNcgW0IqUs8=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjASsxuikpwAtNvwOQwYCGAMJH4ElfliYSOr8OrgvE1h5OfmZ_FLa4HAGa5ExmUoutBFdUfA2GMHYbJLvrApIWC7ioz-wkuiKJ
