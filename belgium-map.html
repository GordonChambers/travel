<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belgium — Four Weeks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#151b24; --paper:#fff; --muted:#5b6472; --line:#e3e7ec; --accent:#0b7a5c;
    --shadow:0 6px 24px rgba(16,24,40,.18);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{overflow:hidden;background:#e8e4dc;color:var(--ink)}
  #map{position:absolute;inset:0;z-index:1}

  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px;pointer-events:none}
  .title-chip{pointer-events:auto;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);
    padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title-chip h1{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
  .title-chip .count{font-size:11.5px;color:var(--muted);white-space:nowrap}

  .ctrl-stack{position:absolute;right:12px;top:70px;z-index:1000;display:flex;flex-direction:column;gap:10px}
  .ctrl-btn{width:46px;height:46px;border:none;border-radius:12px;background:var(--paper);
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);transition:transform .12s ease,background .12s ease}
  .ctrl-btn:active{transform:scale(.93)}
  .ctrl-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .ctrl-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ctrl-btn.active{background:var(--accent);color:#fff}
  .ctrl-btn.locating svg{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.ctrl-btn.locating svg{animation:none;opacity:.6}}

  .panel{position:absolute;left:12px;top:70px;z-index:1000;width:242px;background:var(--paper);
    border-radius:14px;box-shadow:var(--shadow);padding:12px 13px;
    max-height:calc(100vh - 100px);overflow-y:auto;transform-origin:top left;
    transition:opacity .18s ease,transform .18s ease}
  .panel.hidden{opacity:0;transform:scale(.94);pointer-events:none}
  .panel h3{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .layer{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;font-size:13.5px;font-weight:600}
  .layer input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .layer .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
  .swatch{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}

  .pin{width:21px;height:21px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .me-dot{width:18px;height:18px;border-radius:50%;background:#2b7fff;border:3px solid #fff;
    box-shadow:0 0 0 8px rgba(43,127,255,.22),0 2px 6px rgba(0,0,0,.3)}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--paper);
    border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.28);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,.35,1);
    max-height:76vh;overflow-y:auto}
  .sheet.open{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}

  /* ---- gallery ---- */
  .gal{position:relative;background:#eef1f5;border-radius:20px 20px 0 0;overflow:hidden}
  .gal.none{display:none}
  .gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gal-track::-webkit-scrollbar{display:none}
  .gal-track img{width:100%;height:180px;object-fit:cover;flex:0 0 100%;scroll-snap-align:center;display:block}
  .gal-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    display:flex;gap:5px;z-index:2}
  .gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);
    box-shadow:0 1px 2px rgba(0,0,0,.4);transition:background .2s}
  .gal-dots i.on{background:#fff}
  .gal-count{position:absolute;bottom:7px;right:10px;z-index:2;font-size:10px;font-weight:700;
    color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:99px;backdrop-filter:blur(4px)}

  .sheet-body{padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
  .close-x{position:absolute;top:10px;right:10px;width:32px;height:32px;z-index:3;border:none;
    border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:15px;cursor:pointer;line-height:1}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#fff;padding:3px 9px;border-radius:99px;margin-bottom:8px}
  .sheet h2{font-size:19.5px;font-weight:800;margin-bottom:3px;line-height:1.25;letter-spacing:-.01em}
  .zh{font-size:13.5px;color:var(--muted);margin-bottom:5px}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .desc{font-size:14.5px;color:#374050;line-height:1.5;margin-bottom:8px}
  .dist{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:12px;min-height:15px}
  .credit{font-size:10px;color:#95a0ae;margin-top:11px;line-height:1.45}
  .actions{display:flex;gap:8px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px 8px;
    border-radius:12px;border:none;cursor:pointer;font-size:13.5px;font-weight:700;
    text-decoration:none;transition:transform .1s ease}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn.nav{background:var(--ink);color:#fff}
  .btn.gmap{background:#eef1f5;color:var(--ink)}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,80px);z-index:1200;
    background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:transform .25s ease,opacity .25s ease;max-width:88vw;text-align:center;line-height:1.4}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .leaflet-control-attribution{font-size:10px}
  @media (max-width:420px){ .panel{width:210px} }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of places worth visiting"></div>

<div class="topbar">
  <div class="title-chip">
    <h1>Belgium — Four Weeks</h1>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="ctrl-stack">
  <button class="ctrl-btn" id="layersBtn" title="Filter and key" aria-label="Show filters and colour key">
    <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </button>
  <button class="ctrl-btn" id="fsBtn" title="Fullscreen" aria-label="Toggle fullscreen">

</div>

<div class="panel hidden" id="panel">
  <h3>Filter by type</h3>
  <div id="keyList"></div>
  <p class="note">Sub-label under each name is the <b>province</b>. Several places open only on certain days — Cantillon Fri–Sat, 3 Fonteinen Fri–Sun, La Batte Sundays, In de Vrede closed Fridays. Photos are traveller submissions from Google.</p>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Place details">
  <button class="close-x" id="closeSheet" aria-label="Close">✕</button>
  <div class="gal" id="gal">
    <div class="gal-track" id="galTrack"></div>
    <div class="gal-dots" id="galDots"></div>
    <span class="gal-count" id="galCount"></span>
  </div>
  <div class="sheet-body">
    <span class="tag" id="sTag"></span>
    <h2 id="sName"></h2>
    <p class="zh" id="sZh"></p>
    <p class="meta" id="sMeta"></p>
    <p class="desc" id="sDesc"></p>
    <p class="dist" id="sDist"></p>
    <div class="actions">
      <a class="btn nav" id="navBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M3 11l19-8-8 19-2-8-9-3z"/></svg>Directions
      </a>
      <a class="btn gmap" id="gmapBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Place page
      </a>
    </div>
    <p class="credit" id="sCredit"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {"heritage": {"label": "Historic towns & buildings", "color": "#5D4037"}, "temple": {"label": "Abbeys & churches", "color": "#C2185B"}, "museum": {"label": "Museums & arts", "color": "#6A1B9A"}, "beer": {"label": "Breweries & beer", "color": "#0277BD"}, "food": {"label": "Regional food specialities", "color": "#00838F"}, "market": {"label": "Markets & streets", "color": "#F9A825"}, "nature": {"label": "Nature, caves & parks", "color": "#2E7D32"}, "views": {"label": "Viewpoints & citadels", "color": "#E8590C"}, "war": {"label": "WWI & WWII sites", "color": "#455A64"}};
const PLACES = [{"c": "war", "n": "Menin Gate, Ypres", "zh": "West Flanders", "lat": 50.8519937, "lng": 2.8911326, "m": "4.7★ · Free · Last Post 8pm daily", "d": "54,000 names of men with no known grave. The Last Post has been sounded here every single evening since 1928, war years excepted — arrive 30 minutes early for a spot. Recently cleaned, with a new Commonwealth memorial. Pair with the In Flanders Fields Museum and Tyne Cot.", "g": "https://maps.google.com/?cid=13804732144501755827", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjDmBz7_eUPZBEJXOAT8w5Xh0ZoEromFTY64a54dCB4FbCv6gkEeO8W8wJquHCAtdk8WMeAcicR-9-oGVHcOiPs6D-Vcw3DEmLkko34kKWf3sZRGHGG8Vvc6E1fQnjAPz9blEWuXpUa-cwuao9U=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBHF3NFRc7wq0Ws9s7LTTb2EOvMuMW5fHeVq3ryxFL-0fiEY5L4CYVmJ2ePOYDc9mxVW-efn1qZUscGGwEK1cOJKpdh1W8HD7gFbGmtNOiCljRrL8uCdn_kqi8yb-T3qEFxOciUn_wsEi3eOCM=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCRCDOCiWs1EtzxsaJlE3I3mlNUvcW1YLEHqzVFMuVJxbxDgbQJoNUBRFLJfrAPOe3VWwSbJmNUaHxa_Ny5ahDpQE54U_rBqOPRxPF8TnkRwY3VZwQKHvgSrJ-wfebiy7d27_Lo5e7z2BpgYA=s4800-w800-h600"], "a": ["Peter De Lathouwer", "Longdot Claude", "Elizabeth Cutler"]}, {"c": "beer", "n": "In de Vrede — Westvleteren", "zh": "West Flanders", "lat": 50.8948378, "lng": 2.7217969, "m": "4.4★ · CLOSED FRIDAYS · 10am–8pm", "d": "The café opposite Saint Sixtus Abbey, and the only place on earth you can simply walk in and drink Westvleteren 12 — repeatedly voted the best beer in the world and sold nowhere else. Blond, 8 and 12 side by side, plus abbey cheese in the shop. Book to eat. Note the Friday closure.", "g": "https://maps.google.com/?cid=14223133189185467147", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBA9za_b6WqTcGZNpGK_aQGE0D6vJQTNOsEYAIUhuxpWoXmm7FEHGxp04zVyQ4AZB8xcaVlMbVzK1hTBKpp3BT8w5HvIp20MiaEQfDweL0zBPOQxexNnfQMaZ9Ir8lBNl_kBXD8UVs8Xw5juD0=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDaDoUYks44SB2gyph4ZrkAe0TzLlER93lXsbsQQOFZpi-H_M8H2YDZ-K2LIPH6bQOJCKwUnacjDhIwr2xGfQeTVkoIhsdhRqrpniaBZRA2zDdR72W1QJto5DMaMb9_oBQqp3QVenBFh12unQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCmlPnf8hSuSXe3foxP6htR7-Jxp36abpBRCknPhAkuyxsihIiWWQ1f9RUk_fI6tepC64iNAiT1sGRgbdy4NhdWBgG9TLGoV_uvJpO1bavbnLR6M3VFZMcisdHsrroTm3gMP-bGo1_mkAVC1EVdvyO4=s4800-w800-h600"], "a": ["Michiel", "Stuart Cameron", "Gabi Cicconi"]}, {"c": "food", "n": "'t Vistrapje — Ostend", "zh": "West Flanders · grey shrimp", "lat": 51.2333556, "lng": 2.9216679, "m": "4.3★ · Closed Mon–Tue", "d": "Ostend is the home of the North Sea grey shrimp, and *garnaalkroketten* — shrimp croquettes — are the defining Belgian coastal dish. This place does them properly, with sole meunière alongside. Better value and more refined than the tourist brasseries on the seafront.", "g": "https://maps.google.com/?cid=9794683093544134119", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjBivaEc_r_cxLMfGH8-3lTLvisTylLA2bJg0Tf4nc46speaJzCF3QD6wYRvUfP459TdXwr4Y0dEr0SAqfC3SMz2Om-4XznXYm4jL6linqnuTfcJngaXNr3vy6DIEqi4XOySTCWujDCEa4WEAQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBuQjpvhIZ3w5Z-wU-QJ0rR-PAmrWmluJqyG3lwmAZYDLEXAeKnZCHqePqh6-mYqjOYdGUnPjR0bc63faAdx7rPGrevjTJwI4JxbzUHRX6wjNK_ZPjD9mISUipsWsEKS55K3bXNM_KGyhOH=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjA5xIM97O715mbmkCqwQiuN5za2jgZQhPwNn6hHOw08EVt0_gRM0Andn2lvGI1cFPiV04bftsAF-CsbMx8Io_ViMspTdZi-ogjkyXpaMOCCpvPkm0Z7q4Cp-V9exUfY7810EPSlLURhoNdjAeFUro76mg=s4800-w800-h600"], "a": ["'t Vistrapje", "'t Vistrapje", "Rudi Tonniau"]}, {"c": "nature", "n": "Ostend Promenade", "zh": "West Flanders", "lat": 51.2315506, "lng": 2.911163, "m": "Free · 24h", "d": "Belgium's coast is one long tram line — 67km, the longest in the world — and Ostend is its heart. Fish stalls on the Visserskaai selling shrimp by the cone, beach bars, and a promenade built for the Belle Époque crowd. Take the Kusttram along the whole coast if you have a day.", "g": "https://maps.google.com/?cid=257055892693727901", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCwBO7dthjpsasReTbQS835K4C8IC9LOC_ARtc2O64xswOYEnSmJlqbAdtgB1fgffOSDcINykuhEfrQfuwFFw3w8R_rDnQGTEKOE1de2Jc1RuWoWwBfxFJPmebFB9TpPjIopDzF7lfVC8Pg7ynz2mak=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjApOBJRAnV6ff78e2v-6cr5RMncfDeFBRuhCQ-PWWKtXMWimVOaqaqfBAjn_ZnGh0siCC4sjiL3ADcsCdLzbV3HTvO9XzNvrdWg8Gx69ljFzI4xV_1FdO4WrhwmmNlRPHQ9dSEHgZSGBRzOHd4_Q4CbDQ=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjAxGIL2RD-VWvmBuJk3IxC_RU1xpuq-l1MIFFS9f5wxQtPzWnH3oAcZSSOAtuBwVa1D3kY_UmpNave0DX2X3slpk4dWzoPJ5ydW2TrFkYMsFuTM0_Hc-u00lWGeUrWSWzbyXdQcTcAtUv4kMDmBH_yA=s4800-w800-h600"], "a": ["nine t", "Hayat Ali", "Hayat Ali"]}, {"c": "war", "n": "Talbot House, Poperinge", "zh": "West Flanders", "lat": 50.855957, "lng": 2.7232849, "m": "4.7★ · 10am–5:30pm", "d": "A house behind the lines where, from 1915, officers and privates were equals — 'Every-Man's Club'. Still furnished as it was, and you can actually stay the night in the original rooms. Quietly the most moving WWI site in Flanders, and quite different from the cemeteries.", "g": "https://maps.google.com/?cid=11796858010737045831", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAnZp5eBeCSOhwpDCIAdS8SVp7hFt3NEB-qkQYd4BXRzB9ndzkT-bTjDpcjEFVspDYKxFdFBcux3DxrvJdxKQjeDFLwC__r3KAI9ffxrxsNHaJ36nRVRPqiFMukMQ8gHZhI6ZwUJWFI18mlzg=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjB4rMB-eWcHl9APa8NaVGMSGAunBLw-DefeO2Rc8sBaFIR21LCukTC88HF_gmOmW1Fk2wFXVQt1KrkLTOEYZmDz5DgqXpvqx6AiWyDmzxocwORppL6Y4M6ypDbY9h5HGFWqH63NkF9TgrE6vds=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBXjc7sBNcot5AU43FVajg2viZ0th3H1d_q63m-UUyFdLKf65elzYnny221c3HOKEGeepZiW6jZ-CZW5MRyJbx3W7e_h8mlX5250gh5a5DVmYWJ3SohvrQja52f1Ddz6b1KuvZ1B9AX4Ce8=s4800-w800-h600"], "a": ["Talbot House", "Antonio Palazzo", "Kristof Vandenbroucke"]}, {"c": "beer", "n": "Hopmuseum, Poperinge", "zh": "West Flanders · hops", "lat": 50.8551918, "lng": 2.7219794, "m": "4.4★ · Closed Mon · ~€6", "d": "Poperinge grows nearly all of Belgium's hops, and this is the old municipal hop-weighing hall. Free English audio guide, a serious display of Belgian beers on the top floor, and 90 minutes well spent before you drink anything. Two minutes from Talbot House.", "g": "https://maps.google.com/?cid=8824106771244179682", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCKOIvDf61nthZKs3KRlr_BRs_mCyfX6NtQylZQbMPKx_IHY6if0xndCBiitzTKxRIrWG7co5viQzrX5CA4gdk7U9vC2Hp2hWH9w2GOFhDC3pX8HGpjbI0zf46EpkRTxsAwABwv0MMnmtqEwj8=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjAPzJ28v2fbZdQa9XO8CsFSAmwTCY0HUg38Wj6hrtbultL48EaXKA9IBwrQRbJfX2XJEBXiQuUfcBNUUg3SxeNpSla22vgFYHv1WBH7bKRrVuhFlOCpJEdFJ5G6oZnzrBBrNYy_vEt6_aLI=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjCIeKwvR-CwgmQu5XD2F1RzgfndYWIWZ0vaHl-BfKv89Aphl_YQ7mqyJf-pXEH5xeTvWfrnBHRHTfeT7BIIucmdPKtHhrYLiTbxSv2VyTEfYyXhof6mT04GkiH8VpOa7yNVwTNKMg4dr_TShg=s4800-w800-h600"], "a": ["Philip Varechon", "Fletch Martin", "Albert Schans"]}, {"c": "heritage", "n": "Damme", "zh": "West Flanders", "lat": 51.2520763, "lng": 3.2804353, "m": "7km from Bruges", "d": "A medieval port that silted up and stopped, reachable from Bruges by a poplar-lined canal — cycle it, or take the Lamme Goedzak paddle steamer. Now a book town with a Gothic town hall and windmill. Google files it as a locality, hence no photo card.", "g": "https://www.google.com/maps/search/?api=1&query=Damme&query_place_id=ChIJge9PfgZZw0cRME9NL6uZAAQ", "p": [], "a": []}, {"c": "food", "n": "Mattentaart Atelier, Geraardsbergen", "zh": "East Flanders · PGI", "lat": 50.7716382, "lng": 3.8821349, "m": "4.6★ · Closed Mon–Tue · cheap", "d": "Mattentaart is EU-protected: it may only be called that if made in Geraardsbergen or Lierde. A flaky puff-pastry tart of curdled milk curds, painted by Bruegel in 1567. Reviewers travel from Antwerp and Germany for these specifically. Walking distance from the station.", "g": "https://maps.google.com/?cid=6823872922759103552", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjAoOU2CS9a5W1kC75K_muCyIiN9uoAL1IsEUX_qi46FJGSV19ibgZTVPsPPaqWXFIpIaJfnYhQdbfK5u36Lqq3CAEbkRW9hH6omyl6IrGl-NVYxknE6RFUSI9ly6ltK02NGuK2IaaNwrioBc5Cr8Z8z=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBe9ttK_Y2_ZkZgILpfnbqUOoI4Ahe9JMR4wtWSMw2Tn2jib_noo1iwdjmTlrfHW5Yqnu0NXUlkbd5QtDYDZbh6uVuVIhNJKfPeQWVxd5gbkFIBFN66aRViKx1W6RMMNFZL0FZrqhe4gVdP7w=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjASBrmocR5x6SUFQj5fXGRwb2_-PSJDEHrCPeg5ovLEYrZgYL2ADpHW42JGX8xTf06kEnxnF-u0nHb6uA5ClGFriinwT19MSXglvTN5QpyqWXkOSY22ENQOt_-OeM_womeHzEcbynG3v1urwFZFj2K3=s4800-w800-h600"], "a": ["Francis Heijvaert", "Тетяна Денисенко", "Christa Claes"]}, {"c": "food", "n": "Confiserie Temmerman, Ghent", "zh": "East Flanders · cuberdons", "lat": 51.0577955, "lng": 3.7237583, "m": "4.7★ · Closed Mon", "d": "Cuberdons — 'neuzekes', little noses — are cone-shaped Ghent sweets with a hard shell and a syrupy raspberry centre that only lasts a few weeks, which is why you rarely see them abroad. This 19th-century shop with its century-old till also does snowballs and poepkes. The owner explains everything.", "g": "https://maps.google.com/?cid=12317032492449443726", "p": ["https://lh3.googleusercontent.com/place-photos/AG9NLjCYr42bB1hV8WTp5Fc4kGm2Jy75-D8jKDatoCEBDrtiHfq3UCmRCBLPtYg--f9mNJsP_rvcEuQD88xDYGteqtG0ZMamBO7o9iBr8s6eeXVYfi8RHU5UQOoPAzuKI6jgfxwP_fFG2qmB19cr4Q=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjDdZvBSRUGaoQa0kZGBdx15VOU5aqoPNbAoPcx4fdrLQ_TmvjwmKLw6qwh9unUrHRXVoUcyha0Q9pU-7BthU73gJf3cy2LksqNRZhLBaLNJ33WOp6Prsw5pZ3T9NkOBNAuxU0fmHwc9yw99J5abVSDz=s4800-w800-h600", "https://lh3.googleusercontent.com/place-photos/AG9NLjBG-P3SfO-ep-vnhfkBsj2GMLkgmRLzKNywQZ5eeGRjNHjwvM_fFCS const ON = {}; Object.keys(CATS).forEach(k=>ON[k]=true);

/* ---------- GCJ-02 -> WGS-84 (no-op outside mainland China) ----------
   Google returns GCJ-02 ("Mars") coordinates inside mainland China, offset
   several hundred metres from true WGS-84. Convert for the OSM basemap;
   keep the raw values for Amap, which expects GCJ-02. */
const EE = 0.00669342162296594323, A = 6378245.0;
function outOfChina(lat,lng){ return (lng<72.004||lng>137.8347)||(lat<0.8293||lat>55.8271); }
function tLat(x,y){
  let r = -100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r += (20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
  r += (160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  return r;
}
function tLng(x,y){
  let r = 300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
  r += (20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
  r += (150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  return r;
}
function gcj2wgs(lat,lng){
  if(outOfChina(lat,lng)) return [lat,lng];
  let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
  const rad=lat/180*Math.PI;
  let magic=Math.sin(rad); magic=1-EE*magic*magic;
  const sqm=Math.sqrt(magic);
  dLat=(dLat*180)/((A*(1-EE))/(magic*sqm)*Math.PI);
  dLng=(dLng*180)/(A/sqm*Math.cos(rad)*Math.PI);
  return [lat*2-(lat+dLat), lng*2-(lng+dLng)];
}
PLACES.forEach(p=>{ const w=gcj2wgs(p.lat,p.lng); p.wlat=w[0]; p.wlng=w[1]; });

/* ---------- map ---------- */
const map = L.map('map',{zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  maxZoom:19, subdomains:'abcd',
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> · Places &amp; photos © Google'
}).addTo(map);

const groups = {};
Object.keys(CATS).forEach(k => groups[k] = L.layerGroup());
PLACES.forEach(pl => {
  const icon = L.divIcon({className:'',
    html:'<div class="pin" style="background:'+CATS[pl.c].color+'"></div>',
    iconSize:[21,21], iconAnchor:[10,10]});
  const mk = L.marker([pl.wlat,pl.wlng],{icon, title:pl.n, riseOnHover:true});
  mk.on('click',()=>openSheet(pl));
  mk.addTo(groups[pl.c]);
});
Object.keys(CATS).forEach(k => { if(PLACES.some(p=>p.c===k)) groups[k].addTo(map); });

function activeBounds(){
  const pts = PLACES.filter(p=>ON[p.c]).map(p=>[p.wlat,p.wlng]);
  return pts.length ? L.latLngBounds(pts) : L.latLngBounds(PLACES.map(p=>[p.wlat,p.wlng]));
}
function fitAll(){ map.fitBounds(activeBounds(),{padding:[55,55]}); }
fitAll();

/* ---------- panel ---------- */
const keyList = document.getElementById('keyList');
Object.keys(CATS).forEach(k=>{
  const n = PLACES.filter(p=>p.c===k).length;
  if(!n) return;
  const row = document.createElement('label');
  row.className='layer';
  row.innerHTML = '<input type="checkbox" checked>'
    + '<span class="swatch" style="background:'+CATS[k].color+'"></span>'
    + '<span>'+CATS[k].label+'</span><span class="n">'+n+'</span>';
  row.querySelector('input').onchange = e=>{
    ON[k]=e.target.checked;
    e.target.checked ? groups[k].addTo(map) : map.removeLayer(groups[k]);
    updateCount();
  };
  keyList.appendChild(row);
});
function updateCount(){
  const n = PLACES.filter(p=>ON[p.c]).length;
  document.getElementById('count').textContent = n + (n===1?" place":" places");
}
updateCount();

const panel=document.getElementById('panel'), layersBtn=document.getElementById('layersBtn');
layersBtn.onclick=()=>{
  panel.classList.toggle('hidden');
  layersBtn.classList.toggle('active', !panel.classList.contains('hidden'));
};

/* ---------- sheet + gallery ---------- */
const sheet=document.getElementById('sheet'),
      gal=document.getElementById('gal'), galTrack=document.getElementById('galTrack'),
      galDots=document.getElementById('galDots'), galCount=document.getElementById('galCount'),
      sTag=document.getElementById('sTag'), sName=document.getElementById('sName'),
      sZh=document.getElementById('sZh'), sMeta=document.getElementById('sMeta'),
      sDesc=document.getElementById('sDesc'), sDist=document.getElementById('sDist'),
      sCredit=document.getElementById('sCredit'), navBtn=document.getElementById('navBtn'),
      gmapBtn=document.getElementById('gmapBtn');
let selected=null;

function buildGallery(pl){
  galTrack.innerHTML=''; galDots.innerHTML='';
  const pics = pl.p || [];
  if(!pics.length){ gal.classList.add('none'); return; }
  gal.classList.remove('none');
  pics.forEach((src,i)=>{
    const img=document.createElement('img');
    img.src=src; img.alt=pl.n+' — photo '+(i+1)+' of '+pics.length; img.loading='lazy';
    img.onerror=()=>{ img.remove(); syncDots(); };
    galTrack.appendChild(img);
    const dot=document.createElement('i'); if(i===0) dot.className='on';
    galDots.appendChild(dot);
  });
  galCount.textContent='1/'+pics.length;
  galDots.style.display = pics.length>1 ? 'flex' : 'none';
  galCount.style.display = pics.length>1 ? 'block' : 'none';
  galTrack.scrollLeft=0;
}
function syncDots(){
  const imgs=galTrack.querySelectorAll('img');
  if(!imgs.length){ gal.classList.add('none'); return; }
  const i=Math.round(galTrack.scrollLeft/galTrack.clientWidth);
  galDots.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===i));
  galCount.textContent=(i+1)+'/'+imgs.length;
}
galTrack.addEventListener('scroll',()=>{ window.requestAnimationFrame(syncDots); });

function openSheet(pl){
  selected=pl;
  const cat=CATS[pl.c];
  buildGallery(pl);
  sTag.textContent=cat.label; sTag.style.background=cat.color;
  sName.textContent=pl.n;
  sZh.textContent=pl.zh||""; sZh.style.display = pl.zh ? 'block':'none';
  sMeta.textContent=pl.m||"";
  sDesc.textContent=pl.d;
  const credits=(pl.a&&pl.a.length) ? "Photos: "+[...new Set(pl.a)].join(", ")+" — via Google Maps. Traveller submissions, not curated." : "Place data © Google";
  sCredit.textContent=credits;
  navBtn.href="https://www.google.com/maps/dir/?api=1&destination="+pl.wlat+","+pl.wlng
            +"&travelmode=walking";
  gmapBtn.href=pl.g;
  updateDist();
  sheet.classList.add('open');
  map.panTo([pl.wlat,pl.wlng],{animate:true});
}
document.getElementById('closeSheet').onclick=()=>{sheet.classList.remove('open');selected=null;};

/* ---------- fullscreen ---------- */
const fsBtn=document.getElementById('fsBtn');
fsBtn.onclick=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    req ? req.call(el) : toast("Fullscreen isn't available here — open the file in your browser.");
  } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
};
document.addEventListener('fullscreenchange',()=>{
  fsBtn.classList.toggle('active',!!document.fullscreenElement);
  setTimeout(()=>map.invalidateSize(),250);
});

/* ---------- live location ---------- */
const locBtn=document.getElementById('locBtn');
let watchId=null, meMarker=null, accCircle=null, myPos=null, firstFix=true;
const inFrame=(window.self!==window.top);

locBtn.onclick=()=>{
  if(watchId!==null){stopWatch();return;}
  if(!navigator.geolocation){toast("Location isn't available in this browser.");return;}
  if(!window.isSecureContext){
    toast("Location needs a secure page. Serve this file over https:// or localhost — file:// is blocked by the browser.");
    return;
  }
  locBtn.classList.add('locating'); firstFix=true;
  watchId=navigator.geolocation.watchPosition(pos=>{
    locBtn.classList.remove('locating'); locBtn.classList.add('active');
    myPos=[pos.coords.latitude,pos.coords.longitude];
    const acc=pos.coords.accuracy;
    if(!meMarker){
      meMarker=L.marker(myPos,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),title:"You are here"}).addTo(map);
      accCircle=L.circle(myPos,{radius:acc,color:'#2b7fff',weight:1,fillColor:'#2b7fff',fillOpacity:.08}).addTo(map);
    } else { meMarker.setLatLng(myPos); accCircle.setLatLng(myPos).setRadius(acc); }
    if(firstFix){map.setView(myPos,14);firstFix=false;}
    updateDist();
  },err=>{
    locBtn.classList.remove('locating'); stopWatch();
    let msg;
    if(err.code===1) msg = inFrame ? "This preview blocks location. Download the file and open it over https:// for live tracking."
                                   : "Location permission denied — enable it for this site in your browser settings.";
    else if(err.code===2) msg = "Position unavailable — no GPS or network fix right now.";
    else msg = "Timed out getting your location. Try again outdoors.";
    toast(msg);
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
};
function stopWatch(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  locBtn.classList.remove('active','locating');
  if(meMarker){map.removeLayer(meMarker);meMarker=null;}
  if(accCircle){map.removeLayer(accCircle);accCircle=null;}
  myPos=null; updateDist();
}
function updateDist(){
  if(!selected) return;
  if(myPos){
    const d=map.distance(myPos,[selected.wlat,selected.wlng]);
    sDist.textContent = d<1000 ? "📍 "+Math.round(d)+" m away · ~"+Math.max(1,Math.round(d/80))+" min walk"
                               : "📍 "+(d/1000).toFixed(1)+" km away";
  } else sDist.textContent="";
}

document.getElementById('fitBtn').onclick=fitAll;

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}
</script>
